<!doctype html><html lang="pt-br"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>km · chancela</title><style>
/* Escuro por decisao, nao por preferencia do sistema: e onde o autor trabalha. */
:root{color-scheme:dark;--bg:#0F1419;--card:#141B22;--ink:#DCE3EA;--mut:#8695A2;--rule:#232D36;--acc:#6EA8D8;
--ok:#7BC49A;--ok-bg:#16301F;--ace:#E0B463;--ace-bg:#2E2513;--neg:#E09A9A;--neg-bg:#331F1F;
--val:#6EA8D8;--val-bg:#152433;--pend:#8695A2;--pend-bg:#1C242B}
*{box-sizing:border-box}
/* `hidden` esconde, mesmo em quem tem display próprio (a .corpo é flex) */
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--ink);
font:14.5px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
.topo{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:9px 16px;
border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--bg);z-index:5}
.topo b{font-size:15px}
.q,.topo .n{color:var(--mut);font-size:12px;font-family:ui-monospace,Menlo,monospace}
select,.topo button{font:inherit;font-size:12.5px;padding:3px 9px;border-radius:6px;
border:1px solid var(--rule);background:var(--bg);color:var(--ink);cursor:pointer}
.topo .dir{margin-left:auto;display:flex;gap:8px;align-items:center}
.recado{padding:7px 16px;font-size:13px;background:var(--ok-bg);color:var(--ok);
border-bottom:1px solid var(--rule)}
.recado.ruim{background:var(--neg-bg);color:var(--neg)}
.corpo{display:flex;align-items:flex-start}
.lado{width:210px;flex:0 0 210px;border-right:1px solid var(--rule);padding:9px 7px;
position:sticky;top:45px;max-height:calc(100vh - 45px);overflow:auto}
.lado button{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;
font:inherit;padding:6px 8px;border-radius:6px;cursor:pointer}
.lado button:hover{background:var(--card)}
.lado button[aria-current=true]{background:var(--card);box-shadow:inset 2px 0 0 var(--acc)}
.lado .f{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;word-break:break-all}
.barra{display:flex;height:4px;border-radius:3px;overflow:hidden;margin-top:4px;background:var(--rule)}
.barra i{display:block;height:100%}
.rot{font-family:system-ui,sans-serif;font-size:10px;text-transform:uppercase;
letter-spacing:.08em;color:var(--mut)}

/* A grade: uma linha por trecho, tres colunas alinhadas. O texto corre de cima a baixo;
   o que separa um trecho do outro e uma regua fina, nao um cartao. */
.doc{flex:1;min-width:0;border-left:1px solid var(--rule);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 196px;
align-items:stretch}
.cabgrade{position:sticky;top:45px;background:var(--bg);border-bottom:1px solid var(--rule);
padding:6px 14px;z-index:4}
.tr{display:contents}
.col{padding:10px 14px 14px;border-bottom:1px solid var(--rule);min-width:0}
.col.base{border-right:1px solid var(--rule);background:color-mix(in srgb,var(--bg) 55%,#000)}
.col.agora{border-right:1px solid var(--rule)}
.col.agora.inteiro{grid-column:1 / 3}
.col.acoes{display:flex;flex-direction:column;gap:4px;align-items:stretch;padding:10px 10px 12px}
.tr.foco .col{background:color-mix(in srgb,var(--card) 70%,transparent)}
.tr.foco .col.agora{box-shadow:inset 2px 0 0 var(--acc)}
.txt{font:12.9px/1.62 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;
word-break:break-word;overflow-wrap:anywhere}
.chip{font:10.5px/1.7 ui-monospace,Menlo,monospace;padding:0 8px;border-radius:999px;
white-space:nowrap;align-self:flex-start}
.e-aprovado{color:var(--ok);background:var(--ok-bg)}.e-mexido{color:var(--ace);background:var(--ace-bg)}
.e-pendente{color:var(--pend);background:var(--pend-bg)}.e-negado{color:var(--neg);background:var(--neg-bg)}
.acoes button{font:inherit;font-size:12.5px;padding:4px 10px;border-radius:6px;cursor:pointer;
border:1px solid var(--rule);background:var(--bg);color:var(--ink);text-align:left}
.acoes button:hover{border-color:var(--acc)}
.acoes button.pri{background:var(--ok-bg);border-color:var(--ok-bg);color:var(--ok)}
.acoes button[disabled]{opacity:.35;cursor:not-allowed}
.acoes .marcas{display:flex;gap:4px}
.acoes .marcas button{flex:1;text-align:center;padding:3px 0;font-size:12px}
.nota{font-size:12px;border-left:3px solid var(--neg);background:var(--neg-bg);
padding:6px 9px;margin-bottom:8px;border-radius:0 4px 4px 0}
.nota.aviso{border-color:var(--ace);background:var(--ace-bg)}
.form{display:flex;flex-direction:column;gap:5px}
.form input{font:inherit;font-size:12.5px;padding:4px 8px;border-radius:6px;
border:1px solid var(--rule);background:var(--bg);color:var(--ink)}

@media(max-width:1200px){.doc{grid-template-columns:minmax(0,1fr) 150px}
.col.base{display:none}.col.agora.inteiro{grid-column:auto}.lado{width:170px;flex-basis:170px}}

/* uma mudança: cabeçalho de largura inteira, depois um bloco por linha */
.cab-m{grid-column:1 / 4;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;
padding:10px 14px 8px;border-top:1px solid var(--ace);background:color-mix(in srgb,var(--ace-bg) 45%,transparent)}
.cab-m.foco{box-shadow:inset 3px 0 0 var(--acc)}

.cab-m .botoes-m button{font:inherit;font-size:12.5px;padding:3px 10px;border-radius:6px;cursor:pointer;
border:1px solid var(--rule);background:var(--bg);color:var(--ink)}
.cab-m .botoes-m button.pri{background:var(--ok-bg);border-color:var(--ok-bg);color:var(--ok)}
.cab-m .botoes-m button[disabled]{opacity:.35;cursor:not-allowed}
.cab-m .nota{flex-basis:100%;margin:2px 0 0}
.cab-m .form{flex-direction:row;flex-wrap:wrap;align-items:center}
.col.base.novo,.col.agora.sumiu{background:color-mix(in srgb,var(--bg) 70%,#000)}
.inicio-m{border-top:2px solid color-mix(in srgb,var(--ace) 55%,transparent)}
.foco-m{box-shadow:inset 0 2px 0 var(--acc)}
.acoes .par2{display:flex;gap:4px}.acoes .par2 button{flex:1;padding:4px 6px;font-size:12px}
.acoes .tudo{display:flex;flex-direction:column;gap:4px;padding-bottom:8px;margin-bottom:6px;
border-bottom:1px dashed var(--rule)}
#selecao{position:fixed;z-index:20;display:flex;gap:6px;padding:5px;border-radius:8px;
background:var(--card);border:1px solid var(--acc);box-shadow:0 6px 24px #0008}
#selecao[hidden]{display:none}
#selecao button{font:inherit;font-size:12.5px;padding:4px 11px;border-radius:6px;cursor:pointer;
border:1px solid var(--rule);background:var(--bg);color:var(--ink)}
#selecao button.pri{background:var(--ok-bg);border-color:var(--ok-bg);color:var(--ok)}
.dobra{grid-column:1 / 4;padding:4px 14px;color:var(--mut);font-size:11.5px;cursor:pointer;
font-family:ui-monospace,Menlo,monospace;border-bottom:1px solid var(--rule)}
.dobra:hover{color:var(--ink)}
.aviso-doc{grid-column:1 / 4;padding:12px 14px;color:var(--ok);font-size:13px;border-bottom:1px solid var(--rule)}
.bolinha{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.txt.mini{font-size:11.5px;max-height:160px;overflow:auto;margin-top:4px;opacity:.85}
.topo .dir button{padding:3px 8px}
.vistas{display:flex;border:1px solid var(--rule);border-radius:7px;overflow:hidden}
.vistas button{border:0;border-radius:0;padding:4px 12px}
.vistas button[aria-selected=true]{background:var(--ink);color:var(--bg)}
.modo{display:inline-flex;vertical-align:middle}
.topo .modo button{border-radius:0}.topo .modo button+button{border-left:0}
.topo .modo button:first-child{border-radius:6px 0 0 6px}.topo .modo button:last-child{border-radius:0 6px 6px 0}
.topo .modo button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.arquivos{padding:12px 18px 60px;max-width:1100px}
.arvore{font:13px/1.5 ui-monospace,Menlo,monospace}
.arvore .no{display:flex;gap:8px;align-items:center;padding:3px 10px;border-radius:5px;outline:0}
.arvore .no:hover{background:var(--card)}
.arvore .no.foco{box-shadow:inset 0 0 0 1px var(--acc)}
.arvore .seta{width:12px;color:var(--mut);cursor:pointer;user-select:none}
.arvore .caixa{cursor:pointer;font-size:15px;user-select:none}
.arvore .caixa.sim{color:var(--ok)}.arvore .caixa.misto{color:var(--ace)}.arvore .caixa.nao{color:var(--mut)}
.arvore .nome{cursor:pointer}.arvore .nome.pasta{color:#EDF2F7;font-weight:600}
.arvore .novos{font-size:10.5px;padding:0 7px;border-radius:999px;color:var(--ok);background:var(--ok-bg)}
.arvore .novos.herdado{background:transparent;border:1px dashed var(--ok-bg)}
.arvore .info{margin-left:auto;color:var(--mut);font-size:12px;white-space:nowrap}
.arvore .info.e-ok{color:var(--ok)}.arvore .info.e-ace{color:var(--ace)}.arvore .info.e-mut{opacity:.7}
.desfazer{position:relative;display:inline-flex}
.desfazer #btn-desfazer{border-radius:6px 0 0 6px}.desfazer #btn-historico{border-radius:0 6px 6px 0;border-left:0}
#historico{position:absolute;top:30px;right:0;z-index:30;min-width:280px;display:flex;flex-direction:column;
background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:4px;box-shadow:0 8px 24px #0008}
#historico[hidden]{display:none}
#historico button{text-align:left;border:0;padding:6px 10px;background:transparent;color:var(--ink);cursor:pointer}
#historico button:hover{background:var(--bg)}
.vazio-geral.ruim{color:var(--neg)}
.vazio-geral{grid-column:1 / 4;padding:40px 20px;color:var(--mut);display:flex;gap:14px;align-items:center}
.vazio-geral button{font:inherit;padding:5px 12px;border-radius:6px;cursor:pointer;border:1px solid var(--ok-bg);
background:var(--ok-bg);color:var(--ok)}
/* os editores: CodeMirror com o live preview */
.cm-editor{background:transparent;color:var(--ink);font:14.5px/1.62 system-ui,-apple-system,"Segoe UI",sans-serif}
.cm-editor.cm-focused{outline:0}
.cm-content{padding:2px 0;caret-color:var(--acc)}
.cm-line.cm-h{padding-top:.35em}
.cm-link-texto{color:var(--acc)}
.cm-line.cm-cit{border-left:3px solid var(--rule);padding-left:10px;color:#B9C6D2}
.cm-line.cm-cit-alerta{border-color:var(--ace);background:color-mix(in srgb,var(--ace-bg) 55%,transparent)}
.cm-line.cm-cit-pergunta{border-color:var(--val);background:color-mix(in srgb,var(--val-bg) 55%,transparent)}
.cm-line.cm-cit-veto{border-color:var(--neg);background:color-mix(in srgb,var(--neg-bg) 55%,transparent)}
.cm-vencida{color:var(--neg);font-weight:700}
.cm-line.cm-codigo{font-family:ui-monospace,Menlo,monospace;font-size:.92em;background:var(--card)}
.cm-line.cm-cerca{font-size:0;line-height:6px}
.cm-line.cm-hr{border-bottom:1px solid var(--rule);color:transparent}
.cm-bala{color:var(--mut);padding-right:2px}.cm-tarefa{color:var(--acc)}
.cm-tabela{overflow-x:auto;margin:4px 0}
.cm-tabela table{border-collapse:collapse;font-size:13.5px}
.cm-tabela th,.cm-tabela td{border:1px solid var(--rule);padding:4px 8px;vertical-align:top;position:relative}
.cm-tabela th{background:var(--card);font-weight:700}
.cm-tab-ctl{display:none;font:inherit;font-size:11px;padding:0 5px;margin-left:4px;border-radius:4px;
  border:1px solid var(--rule);background:var(--bg);color:var(--mut);cursor:pointer}
.cm-tabela tr:hover .cm-tab-ctl,.cm-tabela th:hover .cm-tab-ctl{display:inline-block}
.cm-tab-ctl.recusado{border-color:var(--neg);color:var(--neg)}
.cm-tab-linha{border:0 !important;background:transparent;white-space:nowrap}
.col.mudanca-cm{grid-column:1 / 3;padding:0}
@media(max-width:1200px){.col.mudanca-cm{grid-column:1 / 2}}
.cm-mergeView .cm-editor{padding:10px 14px}
/* As duas colunas de uma mudança vão da borda de cima à de baixo da linha, como as outras:
   a da chancela escura e separada por um fio; a de hoje, com o fundo da página. */
.col.mudanca-cm{display:flex;flex-direction:column}
.col.mudanca-cm>.cm-lugar{flex:1;display:flex;flex-direction:column}
.cm-lugar>.cm-mergeView{flex:1;display:flex;flex-direction:column}
.cm-mergeViewEditors{flex:1}
.cm-mergeViewEditor:first-child{background:color-mix(in srgb,var(--bg) 55%,#000);border-right:1px solid var(--rule)}
/* O que mudou se marca na palavra; a linha inteira não ganha fundo. */
.col.mudanca-cm .cm-merge-a .cm-changedText{text-decoration:line-through;text-decoration-color:var(--neg);background:none}
.col.mudanca-cm .cm-mergeView .cm-editor .cm-changedLine,.col.mudanca-cm .cm-mergeView .cm-editor .cm-deletedChunk{background:transparent}
.grudado{position:sticky;top:46px;display:flex;flex-direction:column;gap:4px}
</style></head><body>
<div class="topo"><b id="repo">km</b>
<div class="vistas" role="tablist">
  <button role="tab" id="aba-revisar" aria-selected="true" onclick="mostrar('revisar')">Revisar</button>
  <button role="tab" id="aba-arquivos" aria-selected="false" onclick="mostrar('arquivos')">Arquivos</button>
</div>
<span class="n" id="resumo"></span>
<div class="dir">
<span id="so-revisar">
  <span class="q">no cursor:</span>
  <button onmousedown="event.preventDefault()" onclick="noCursor('⚠️')" title="ressalva: sem certeza">⚠️</button>
  <button onmousedown="event.preventDefault()" onclick="noCursor('❓')" title="a confirmar, com prazo">❓</button>
  <button onmousedown="event.preventDefault()" onclick="noCursor('🚫')" title="discordo — bloqueia a chancela">🚫</button>
  <span style="width:10px"></span>
  <span class="q">comparar com</span><select id="base" onchange="trocarBase()"></select>
  <button onclick="setVer('tudo')" id="v-tudo">texto inteiro</button>
  <button onclick="setVer('mudou')" id="v-mudou">só as mudanças</button>
  <span class="modo" title="Formatado: o documento como se lê · Código: o Markdown como está no arquivo">
    <button onmousedown="event.preventDefault()" onclick="setModo(false)" id="m-formatado">Formatado</button>
    <button onmousedown="event.preventDefault()" onclick="setModo(true)" id="m-codigo">Código</button>
  </span>
</span>
<span id="so-arquivos" hidden>
  <span class="desfazer">
    <button id="btn-desfazer" onclick="desfazer(1)" disabled title="Desfazer (Ctrl+Z)">↶ Desfazer</button>
    <button id="btn-historico" onclick="abrirHistorico()" disabled aria-haspopup="menu" title="Os últimos passos">▾</button>
    <div id="historico" role="menu" hidden></div>
  </span>
  <button id="btn-refazer" onclick="refazer()" disabled title="Refazer (Ctrl+Shift+Z)">↷</button>
</span>
</div></div>
<div class="recado" id="recado" hidden></div>
<div id="selecao" hidden>
  <button class="pri" onmousedown="event.preventDefault()" onclick="naSelecao('aprovar')">Aprovar seleção</button>
  <button onmousedown="event.preventDefault()" onclick="naSelecao('reverter')">Reverter seleção</button>
</div>
<div class="corpo"><nav class="lado" id="lado"></nav><main class="doc" id="doc"></main></div>
<main id="arquivos" class="arquivos" hidden></main>
<script type="module" src="/static/painel/editores.js"></script>
<script>
const $ = (id) => document.getElementById(id);
// Os editores chegam como módulo, depois deste script; tudo que desenha espera por eles.
const kmPronto = new Promise((ok) => window.km ? ok() : window.addEventListener('km-pronto', ok, { once: true }));
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const neg = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
const emDias = n => new Date(Date.now()+n*864e5).toISOString().slice(0,10);
const MODELO = {'⚠️': '> ⚠️ **sem certeza** — ', '🚫': '> 🚫 **discordo** — ',
                '❓': () => '> ❓ **a confirmar até ' + emDias(14) + '** — '};
const TIPO = {novo: 'novo', sumiu: 'saiu', mexido: 'editado'};

let D = null, doc = 0, ver = 'tudo', base = null, foco = null;
let form = null, recado = '', conflito = null;
// O texto que você escreveu e ainda não salvou, por pedaço da tela. Enquanto houver algo
// aqui a tela não se recarrega sozinha: recarregar apagaria o que você digitou.
let sujos = {}, originais = {};
const temSujo = () => Object.keys(sujos).length > 0;
const naChancela = () => !D || D.base === 'refs/km/chancela';
// O texto do arquivo termina em quebra de linha e o da tela não; comparar sem isso evita
// marcar como editado um pedaço em que você só clicou.
const mesmo = (a, b) => (a||'').replace(/\s+$/, '') === (b||'').replace(/\s+$/, '');

let carregando = false;
async function carregar(arquivo){
  if (carregando && !arquivo) return;   // um pedido de cada vez: não empilhar recargas
  carregando = true;
  try { return await _carregar(arquivo); } finally { carregando = false; }
}
async function _carregar(arquivo){
  // Só o documento aberto vem com o texto; o resto é a régua lateral.
  const q = new URLSearchParams();
  if (base) q.set('base', base);
  const alvo = arquivo || (D && D.docs[doc] ? D.docs[doc].file : '');
  if (alvo) q.set('file', alvo);
  const nova = await (await fetch('/api/state?' + q)).json();
  base = nova.base;
  const i = nova.docs.findIndex(d => d.file === alvo);
  const antigo = JSON.stringify(D), velho = D, docVelho = doc;
  D = nova; doc = i >= 0 ? i : 0;
  if (D.docs[doc] && !D.docs[doc].cheio) return _carregar(D.docs[doc].file);
  await kmPronto;
  // A recarga de 8 em 8 segundos não reconstrói os editores se nada mudou: reconstruir tira
  // o cursor do lugar e pisca a tela de quem só está lendo.
  if (!arquivo && JSON.stringify(D) === antigo) return;
  // Quem digitou ou está com o cursor num editor enquanto a recarga voltava não perde o texto
  // nem o foco. A página fica inteira no estado que os editores mostram — os shas e as posições
  // precisam casar com eles — e a próxima recarga, depois de salvar ou sair do texto, redesenha.
  if (!arquivo && (temSujo() || km.focado())) { D = velho; doc = docVelho; return; }
  desenhar();
}

async function agir(corpo){
  const r = await fetch('/api/act', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({...corpo, file: D.docs[doc].file,
                          base: naChancela() ? '' : base})});
  const j = await r.json();
  if (j.estado) D = j.estado;
  recado = j.ok ? '✓ ' + (j.msg || 'feito') : '✕ ' + (j.erro || 'não deu');
  if (j.conflito) conflito = {chave: corpo.chave, atual: j.conflito.atual};
  else { conflito = null; form = null; if (j.ok && corpo.chave) delete sujos[corpo.chave]; }
  desenhar();
  if (j.ok && !temSujo()) setTimeout(() => carregar(), 50);
}

const segs = () => (D && D.docs[doc] && D.docs[doc].segmentos) || [];
const mudancas = () => segs().filter(s => s.tipo === 'mudanca');
const achar = (n) => mudancas().find(m => m.n === n);

// ---- a régua da esquerda ----------------------------------------------------------
function lado(){
  let divisor = false;
  $('lado').innerHTML = D.docs.map((d,i)=>{
    let antes = '';
    if (!d.rastreado && !divisor) { divisor = true;
      antes = '<div class="rot" style="padding:11px 8px 5px">sem chancela ainda</div>'; }
    const estado = !d.rastreado ? 'sem chancela' : (d.pendente ? `${d.pct} a aprovar` : 'em dia');
    const cor = !d.rastreado ? 'var(--rule)' : (d.bloqueado ? 'var(--neg)' : (d.pendente ? 'var(--ace)' : 'var(--ok)'));
    return antes + `<button aria-current="${i===doc}" onclick="abrir(${i})">
      <div class="f">${esc(d.file)}</div>
      <div class="q"><i class="bolinha" style="background:${cor}"></i>${estado}${d.vencidas?' · ❓ vencida':''}</div></button>`;
  }).join('');
}

// ---- os editores ------------------------------------------------------------------
// Cada trecho igual é um editor; cada trecho mudado, uma MergeView (chancela à esquerda,
// hoje à direita). Eles guardam o texto do arquivo e nada mais.
function lugar(chave, linha){
  return `<div class="cm-lugar" data-chave="${esc(chave)}" data-linha="${linha}"></div>`;
}
function montarEditores(){
  for (const el of document.querySelectorAll('.cm-lugar')) {
    const chave = el.dataset.chave;
    const s = chave.startsWith('c:') ? mudancas().find((m) => 'c:' + m.chave === chave)
                                     : segs().find((x) => 'g:' + x.linha === chave);
    if (!s) continue;
    const hojeTexto = chave.startsWith('c:') ? s.agora : s.texto;
    originais[chave] = hojeTexto;
    const atual = sujos[chave] !== undefined ? sujos[chave] : hojeTexto;
    const mudou = (t) => mexeuTexto(chave, t);
    if (chave.startsWith('c:')) km.editorMudanca(el, chave, s.antes, atual, naChancela(), mudou, mostrarBarraSelecao);
    else km.editorSimples(el, chave, atual, true, mudou, null);
  }
}

// ---- o que fazer, por bloco e por mudança -----------------------------------------
function salvarCel(chave){
  if (sujos[chave] === undefined) return '';
  let out = `<span class="chip e-mexido">editado aqui</span>
    <button class="pri" onclick="salvar('${chave}')">Salvar no arquivo</button>
    <button onclick="descartar('${chave}')">Descartar</button>
    <div class="q">Ctrl+S salva · Esc descarta</div>`;
  if (conflito && conflito.chave === chave) {
    out += `<div class="nota"><b>esse texto mudou no arquivo</b>
      <div class="q">outro agente ou o editor chegaram primeiro. Nada foi sobrescrito.
      No arquivo agora:</div><div class="txt mini">${esc(conflito.atual)}</div></div>
      <button onclick="copiar('${chave}')">Copiar o meu texto</button>`;
  }
  return out;
}

function formulario(chave, shas){
  const rot = {validar:['o que falta confirmar','prazo'], reverter:['por que não serve (opcional)','']}[form.tipo];
  return `<div class="form">
    <input id="f-texto" placeholder="${esc(rot[0])}"
      onkeydown="if(event.key==='Enter')enviar();if(event.key==='Escape')fechar()">
    ${rot[1]==='prazo'?`<input id="f-prazo" value="${emDias(14)}">`:''}
    <button class="pri" onclick="enviar()">${form.tipo==='reverter'?'Reverter':'Escrever e chancelar'}</button>
    <button onclick="fechar()">cancelar</button>
    <div class="q">${form.tipo==='validar'?'o ❓ e o prazo entram no texto, logo depois do bloco'
      :'o texto volta ao que você chancelou'}</div></div>`;
}

function acoesDaMudanca(m){
  const chave = 'c:' + m.chave;
  if (sujos[chave] !== undefined) return salvarCel(chave);
  const shas = m.unidades.map(u => u.sha);
  if (form && form.chave === chave) return formulario(chave, shas);
  const rotulo = {novo: 'novo', saiu: 'saiu', editado: 'editado'}[m.geral];
  if (!naChancela()) return `<span class="chip e-pendente">${rotulo}</span>`;
  const js = esc(JSON.stringify(shas));
  const marcas = m.agora ? `<div class="marcas">
      <button onclick="marcaNaMudanca('${chave}','⚠️')" title="ressalva: sem certeza">⚠️</button>
      <button onclick="marcaNaMudanca('${chave}','🚫')" title="discordo — bloqueia a chancela">🚫</button></div>` : '';
  return `<span class="chip ${m.geral==='saiu'?'e-negado':(m.geral==='novo'?'e-aprovado':'e-mexido')}">${rotulo}</span>
    <button class="pri" ${m.bloqueio?'disabled title="resolva o 🚫 primeiro"':''} onclick="aprovar(${js})">${m.geral==='saiu'?'Aprovar a remoção':'Aprovar'}</button>
    <div class="par2">
      <button onclick="abrirForm('${chave}','validar',${js})">A validar…</button>
      <button onclick="abrirForm('${chave}','reverter',${js})">${m.geral==='saiu'?'Trazer de volta':'Reverter'}</button></div>
    ${marcas}
    <div class="q">para aprovar só uma parte, selecione o texto</div>`;
}

function avisosDaMudanca(m){
  let out = '';
  for (const s of (m.sumidas||[])) out += `<div class="nota"><b>ressalva removida</b> — ${neg(s.replace(/^\s*>\s*/,''))}
    <div class="q">estava na chancela; aprovar aqui aprova a remoção</div></div>`;
  if (m.bloqueio) out += `<div class="nota"><b>🚫 bloqueado</b> — ${neg(m.bloqueio.replace(/^\s*>\s*/,''))}</div>`;
  return out;
}

// ---- o documento ----------------------------------------------------------------
function desenhar(){
  if (!D) return;
  $('repo').textContent = D.repo;
  const em = D.docs.filter(d => d.rastreado && !d.pendente).length;
  const sem = D.docs.filter(d => !d.rastreado).length;
  $('resumo').textContent = `${D.docs.length} arquivos · ${em} em dia · `
    + (D.pct ? `${D.pct} do conteúdo a aprovar` : 'nada a aprovar') + (sem ? ` · ${sem} sem chancela` : '');
  const r = $('recado'); r.hidden = !recado; r.textContent = recado;
  r.className = 'recado' + (recado.startsWith('✕') ? ' ruim' : '');
  $('base').innerHTML = D.revisoes.map(v =>
    `<option value="${esc(v.rev)}" ${v.rev===D.base?'selected':''}>${esc(v.label)}</option>`).join('');
  $('v-tudo').setAttribute('aria-pressed', ver==='tudo');
  $('v-mudou').setAttribute('aria-pressed', ver==='mudou');
  lado();

  const d = D.docs[doc];
  originais = {};
  km.destruirTodos();
  if (!d) {
    // Nada acompanhado ainda: um repositório novo, ou tudo pausado. A revisão não tem o
    // que mostrar, e o caminho é escolher arquivos. Uma config quebrada diz o que tem.
    if (D.erro) { $('doc').innerHTML = `<div class="vazio-geral ruim">✕ ${esc(D.erro)}</div>`; return; }
    $('doc').innerHTML = `<div class="vazio-geral">Nenhum arquivo é acompanhado ainda.
      <button class="pri" onclick="mostrar('arquivos')">Escolher arquivos</button></div>`;
    return;
  }
  let html = `<div class="cabgrade rot">${naChancela() ? 'a chancela' : esc(D.base)}</div>
    <div class="cabgrade rot">${esc(d.file)} — agora</div>
    <div class="cabgrade rot">${naChancela() ? 'o que fazer' : 'só leitura — os botões agem na chancela'}</div>`;
  if (!segs().some(s => s.tipo === 'mudanca'))
    html += `<div class="aviso-doc">${d.rastreado ? '✓ Em dia com a chancela' + (d.em ? ' de ' + esc(d.em) : '') + '. Nada a decidir neste arquivo.' : ''}</div>`;
  for (const s of segs()){
    if (s.tipo === 'igual') {
      const chave = 'g:' + s.linha;
      if (ver === 'mudou' && sujos[chave] === undefined) {
        html += `<div class="dobra" onclick="setVer('tudo')">⋯ ${s.n_linhas} linhas sem mudança</div>`;
        continue;
      }
      html += `<div class="col agora inteiro">${lugar(chave, s.linha)}</div>
        <div class="col acoes" data-acoes="${esc(chave)}">${salvarCel(chave)}</div>`;
      continue;
    }
    const chave = 'c:' + s.chave;
    const inicio = ` inicio-m${foco === 'm:' + s.n ? ' foco-m' : ''}`;
    html += `<div class="col mudanca-cm ${s.geral}${inicio}" id="m${s.n}">${avisosDaMudanca(s)}${lugar(chave, s.linha)}</div>
      <div class="col acoes${inicio}" data-acoes="${esc(chave)}"><div class="grudado">${acoesDaMudanca(s)}</div></div>`;
  }
  $('doc').innerHTML = html;
  montarEditores();
  const campo = $('f-texto');
  if (campo) campo.focus();
}

// ---- gestos -----------------------------------------------------------------------
function abrir(i){
  if (temSujo() && !confirm('Há texto editado e não salvo. Sair mesmo assim?')) return;
  sujos = {}; conflito = null; form = null; foco = null; scrollTo(0,0);
  carregar(D.docs[i].file);
}
function fechar(){ form = null; desenhar(); }
function abrirForm(chave, tipo, shas){ form = {chave, tipo, shas}; desenhar(); }
function aprovar(shas){ agir({acao:'aprovar', shas}); }
function enviar(){
  const texto = ($('f-texto')||{}).value || '';
  const prazo = ($('f-prazo')||{}).value || '';
  if (form.tipo === 'validar') return agir({acao:'validar', shas: form.shas, texto, prazo});
  return agir({acao:'reverter', shas: form.shas, motivo: texto});
}
function mexeuTexto(chave, texto){
  if (mesmo(texto, originais[chave])) delete sujos[chave]; else sujos[chave] = texto;
  // Só a coluna das ações muda; o texto que você está digitando fica onde está.
  const cel = document.querySelector(`[data-acoes="${CSS.escape(chave)}"]`);
  if (!cel) return;
  const m = chave.startsWith('c:') ? mudancas().find((x) => 'c:' + x.chave === chave) : null;
  cel.innerHTML = m ? `<div class="grudado">${acoesDaMudanca(m)}</div>` : salvarCel(chave);
}
function salvar(chave){
  if (sujos[chave] === undefined) return;
  const el = document.querySelector(`.cm-lugar[data-chave="${CSS.escape(chave)}"]`);
  agir({acao:'salvar', chave, original: originais[chave], texto: sujos[chave],
        linha: el ? Number(el.dataset.linha) : 1});
}
function descartar(chave){ delete sujos[chave]; if (conflito && conflito.chave === chave) conflito = null; desenhar(); }
function copiar(chave){ navigator.clipboard?.writeText(sujos[chave] || ''); recado = '✓ seu texto está na área de transferência'; desenhar(); }

// A marca entra onde está o cursor, no formato combinado, e vira texto seu: você completa
// e salva como qualquer outra edição.
const modeloDe = (marca) => typeof MODELO[marca] === 'function' ? MODELO[marca]() : MODELO[marca];
function noCursor(marca){
  const chave = km.focado();
  if (!chave) { recado = '✕ clique no texto, onde a marca deve entrar, e depois no botão'; return desenhar(); }
  km.inserirMarca(chave, modeloDe(marca));
}
function marcaNaMudanca(chave, marca){
  km.focarFim(chave);
  km.inserirMarca(chave, modeloDe(marca));
}
// ---- aprovar parte de um bloco ----------------------------------------------------
// Como aceitar metade de um hunk numa revisão de código: selecione, na coluna do texto
// de hoje, o pedaço cuja mudança você aceita. O resto do bloco continua pendente.
function selecaoAtual(){
  const chave = km.focado();
  if (!chave || !chave.startsWith('c:') || !naChancela()) return null;
  if (sujos[chave] !== undefined) return {erro: 'salve ou descarte a edição deste trecho antes de aprovar parte dela'};
  const sel = km.selecao(chave), m = mudancas().find((x) => 'c:' + x.chave === chave);
  if (!sel || !m) return null;
  // O motor aplica por bloco; a tela converte a seleção no trecho em "esta parte deste bloco".
  const shas = [], parciais = [];
  for (const u of m.unidades) {
    if (u.ini === u.fim) { if (sel.a <= u.ini && u.ini <= sel.b) shas.push(u.sha); continue; }
    if (sel.b <= u.ini || sel.a >= u.fim) continue;
    if (sel.a <= u.ini && sel.b >= u.fim) shas.push(u.sha);
    else parciais.push({sha: u.sha, ini: Math.max(sel.a, u.ini) - u.ini, fim: Math.min(sel.b, u.fim) - u.ini});
  }
  return (shas.length || parciais.length) ? {shas, parciais, rect: sel.rect} : null;
}
function mostrarBarraSelecao(){
  const barra = $('selecao'), sel = selecaoAtual();
  if (!sel || sel.erro || !sel.rect) { barra.hidden = true; return; }
  barra.hidden = false;
  barra.style.top = Math.max(50, sel.rect.top - 40) + 'px';
  barra.style.left = Math.min(innerWidth - 300, Math.max(10, sel.rect.left)) + 'px';
}
function naSelecao(acao){
  const sel = selecaoAtual();
  if (!sel) return;
  if (sel.erro) { recado = '✕ ' + sel.erro; return desenhar(); }
  $('selecao').hidden = true;
  agir({acao, shas: sel.shas, parciais: sel.parciais});
}

function setVer(v){ ver = v; desenhar(); }
// Formatado ou Código, lembrado neste navegador. Trocar não refaz os editores: o cursor, o
// Ctrl+Z e o que você digitou continuam lá.
let codigo = false;
try { codigo = localStorage.getItem('km-modo') === 'codigo'; } catch (e) {}
function setModo(c){
  codigo = c;
  try { localStorage.setItem('km-modo', c ? 'codigo' : 'formatado'); } catch (e) {}
  $('m-formatado').setAttribute('aria-pressed', !c);
  $('m-codigo').setAttribute('aria-pressed', c);
  kmPronto.then(() => km.modo(c));
}
setModo(codigo);
function trocarBase(){ base = $('base').value; carregar(); }

document.addEventListener('keydown', (e)=>{
  if (vista !== 'revisar') return;
  const el = e.target;
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    const chave = km.focado();
    if (chave) salvar(chave);
    return;
  }
  if (el.isContentEditable) {
    const chave = km.focado();
    if (e.key === 'Escape' && chave) { el.blur(); descartar(chave); }
    return;   // dentro do texto, letra é letra
  }
  if (el.tagName === 'INPUT' || el.tagName === 'SELECT') { if (e.key === 'Escape') fechar(); return; }
  const ms = mudancas();
  if (!ms.length) return;
  const atual = foco && foco.startsWith('m:') ? Number(foco.slice(2)) : 0;
  const pos = ms.findIndex(m => m.n === atual);
  const ir = (m) => { foco = 'm:' + m.n; desenhar(); $('m' + m.n)?.scrollIntoView({block:'center'}); };
  if (e.key === 'j') ir(ms[Math.min(pos + 1, ms.length - 1)]);
  else if (e.key === 'k') ir(ms[Math.max(pos - 1, 0)]);
  else if (e.key === 'a' && pos >= 0 && naChancela()) aprovar(ms[pos].unidades.map(u => u.sha));
});

// O arquivo muda por fora: um agente escreve, o editor salva. A tela se atualiza sozinha
// quando você não está no meio de escrever nada.
setInterval(()=>{ if (vista === 'revisar' && !form && !temSujo()) carregar(); }, 8000);
// ---- a vista Arquivos --------------------------------------------------------------
let vista = 'revisar', ARV = null, abertas = new Set(), focoArq = '.';
// Os últimos 5 passos, e o que foi desfeito, para refazer. Vive na página: a árvore
// sempre mostra o estado atual, e cada passo é barato.
let passos = [], refeitos = [];

function mostrar(v){
  vista = v;
  $('aba-revisar').setAttribute('aria-selected', v === 'revisar');
  $('aba-arquivos').setAttribute('aria-selected', v === 'arquivos');
  $('so-revisar').hidden = v !== 'revisar';
  $('so-arquivos').hidden = v !== 'arquivos';
  $('resumo').hidden = v !== 'revisar';        // o resumo é da revisão; na árvore, cada linha diz o seu
  document.querySelector('.corpo').hidden = v !== 'revisar';
  $('arquivos').hidden = v !== 'arquivos';
  if (v === 'arquivos') carregarArvore(); else carregar();
}

async function carregarArvore(){
  ARV = await (await fetch('/api/arquivos')).json();
  if (!abertas.size) abrirOndeHa(ARV.raiz);
  desenharArvore();
}

function abrirOndeHa(n){
  // Abre as pastas onde há algo acompanhado; o resto começa fechado.
  if (n.tipo !== 'pasta') return;
  if (n.caminho === '.' || n.acompanhados > 0) abertas.add(n.caminho);
  n.filhos.forEach(abrirOndeHa);
}

const CAIXA = {sim: '☑', nao: '☐', misto: '◐'};
const ARIA = {sim: 'true', nao: 'false', misto: 'mixed'};

function linhaArvore(n, nivel){
  const pasta = n.tipo === 'pasta';
  const aberta = abertas.has(n.caminho);
  const info = pasta
    ? (n.total === 0 ? '' : (n.acompanhados === 0 ? 'nenhum' : `${n.acompanhados} de ${n.total}`))
      + (n.excecoes ? ` · ${n.excecoes} exceç${n.excecoes > 1 ? 'ões' : 'ão'}` : '')
    : (n.excecao ? 'exceção' : n.estado);
  const novos = pasta && n.novos
    ? `<span class="novos ${n.regra_propria ? '' : 'herdado'}" title="${n.regra_propria
        ? 'arquivos novos nesta pasta entram sozinhos' : 'entram sozinhos, pela regra de uma pasta acima'}">+ novos</span>` : '';
  let html = `<div class="no ${focoClasse(n)}" role="treeitem" aria-level="${nivel + 1}"
      aria-checked="${ARIA[n.marcado]}" ${pasta ? `aria-expanded="${aberta}"` : ''}
      data-caminho="${esc(n.caminho)}" tabindex="${n.caminho === focoArq ? 0 : -1}"
      style="padding-left:${12 + nivel * 20}px">
    <span class="seta" data-acao="alternar">${pasta ? (aberta ? '▾' : '▸') : ''}</span>
    <span class="caixa ${n.marcado}" data-acao="clicar">${CAIXA[n.marcado]}</span>
    <span class="nome ${pasta ? 'pasta' : ''}" data-acao="${pasta ? 'alternar' : 'clicar'}">${esc(n.caminho === '.' ? n.nome + '/' : n.nome + (pasta ? '/' : ''))}</span>
    ${novos}<span class="info ${estadoClasse(n)}">${esc(info)}</span></div>`;
  if (pasta && aberta) html += `<div role="group">${n.filhos.map(f => linhaArvore(f, nivel + 1)).join('')}</div>`;
  return html;
}
const focoClasse = (n) => n.caminho === focoArq ? 'foco' : '';
function estadoClasse(n){
  if (n.tipo === 'pasta') return '';
  if (n.estado === 'em dia') return 'e-ok';
  if (n.estado.endsWith('a aprovar')) return 'e-ace';
  if (n.estado.startsWith('pausado') || n.estado === 'não existe mais') return 'e-mut';
  return '';
}

function desenharArvore(){
  const a = $('arquivos');
  // Quem estava usando o teclado na árvore continua nela depois de redesenhar: o
  // innerHTML troca os elementos, e o foco iria parar no corpo da página.
  const noTeclado = !!document.activeElement?.closest?.('.arvore');
  const erro = ARV.erro ? `<div class="recado ruim">✕ ${esc(ARV.erro)}</div>` : '';
  a.innerHTML = erro + `<div class="arvore" role="tree" aria-multiselectable="true"
    aria-label="arquivos acompanhados">${linhaArvore(ARV.raiz, 0)}</div>`;
  $('btn-desfazer').disabled = $('btn-historico').disabled = !passos.length;
  $('btn-refazer').disabled = !refeitos.length;
  const f = a.querySelector(`[data-caminho="${CSS.escape(focoArq)}"]`);
  if (f && noTeclado) f.focus();
}

// Um ouvinte só, que lê o caminho do atributo: um nome de arquivo nunca vira código.
// Antes, cada linha montava onclick="clicar('…')" — um arquivo chamado it's.md quebrava a
// linha, e um nome escolhido a dedo rodava script no painel que grava documentos.
$('arquivos').addEventListener('click', (e) => {
  const alvo = e.target.closest('[data-acao]');
  const linha = alvo && alvo.closest('[data-caminho]');
  if (!linha) return;
  if (alvo.dataset.acao === 'alternar') alternar(linha.dataset.caminho);
  else clicar(linha.dataset.caminho);
});

function acharNo(caminho, n = ARV.raiz){
  if (n.caminho === caminho) return n;
  for (const f of (n.filhos || [])) { const r = acharNo(caminho, f); if (r) return r; }
  return null;
}
function alternar(caminho){
  abertas.has(caminho) ? abertas.delete(caminho) : abertas.add(caminho);
  focoArq = caminho; desenharArvore();
}

async function clicar(caminho){
  const n = acharNo(caminho); if (!n) return;
  focoArq = caminho;
  const r = await (await fetch('/api/arquivos', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({caminho, pasta: n.tipo === 'pasta', marcar: n.marcado !== 'sim', sha: ARV.sha})})).json();
  ARV = r.arvore;
  recado = r.ok ? '✓ ' + r.msg : '✕ ' + r.erro;
  if (r.ok) { passos.push(r.passo); passos = passos.slice(-5); refeitos = []; }
  desenharRecado(); desenharArvore();
}

async function trocar(config, esperado){
  const r = await (await fetch('/api/arquivos/desfazer', {method: 'POST',
    headers: {'Content-Type': 'application/json'}, body: JSON.stringify({config, esperado})})).json();
  ARV = r.arvore;
  if (!r.ok) { recado = '✕ ' + r.erro; passos = []; refeitos = []; }
  return r.ok;
}
async function desfazer(quantos){
  // Desfaz de trás para frente, um passo de cada vez: cada um confere o anterior.
  for (let k = 0; k < quantos && passos.length; k++) {
    const p = passos[passos.length - 1];
    if (!(await trocar(p.antes, p.depois))) break;
    refeitos.push(passos.pop());
    recado = '↶ desfeito: ' + p.rotulo;
  }
  $('historico').hidden = true;
  desenharRecado(); desenharArvore();
}
async function refazer(){
  const p = refeitos[refeitos.length - 1]; if (!p) return;
  if (await trocar(p.depois, p.antes)) { passos.push(refeitos.pop()); recado = '↷ refeito: ' + p.rotulo; }
  desenharRecado(); desenharArvore();
}
function abrirHistorico(){
  const h = $('historico');
  h.innerHTML = passos.slice().reverse().map((p, i) =>
    `<button role="menuitem" onclick="desfazer(${i + 1})">${esc(p.rotulo)}</button>`).join('');
  h.hidden = !h.hidden;
}
function desenharRecado(){
  const r = $('recado'); r.hidden = !recado; r.textContent = recado;
  r.className = 'recado' + (recado.startsWith('✕') ? ' ruim' : '');
}

// O teclado da árvore é o padrão WAI-ARIA: ↑ ↓ andam, ← → fecham e abrem, espaço marca.
function visiveisArvore(){ return [...document.querySelectorAll('.arvore [role="treeitem"]')].map(e => e.dataset.caminho); }
document.addEventListener('keydown', (e) => {
  if (vista !== 'arquivos') return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
    e.preventDefault(); return e.shiftKey ? refazer() : desfazer(1);
  }
  if (!e.target.closest || !e.target.closest('.arvore')) return;
  const vis = visiveisArvore(), i = vis.indexOf(focoArq), n = acharNo(focoArq);
  const ir = (c) => { focoArq = c; desenharArvore(); };
  if (e.key === 'ArrowDown' && i < vis.length - 1) { e.preventDefault(); ir(vis[i + 1]); }
  else if (e.key === 'ArrowUp' && i > 0) { e.preventDefault(); ir(vis[i - 1]); }
  else if (e.key === 'ArrowRight' && n?.tipo === 'pasta' && !abertas.has(focoArq)) { e.preventDefault(); alternar(focoArq); }
  else if (e.key === 'ArrowLeft' && n?.tipo === 'pasta' && abertas.has(focoArq)) { e.preventDefault(); alternar(focoArq); }

});
