<!doctype html><html lang="pt-br"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>km · chancela</title><style>
/* Escuro por decisao, nao por preferencia do sistema: e onde o autor trabalha. */
:root{--h-topo:45px;--h-cab:29px;color-scheme:dark;--bg:#0F1419;--card:#141B22;--ink:#DCE3EA;--mut:#8695A2;--rule:#232D36;--acc:#6EA8D8;
--ok:#7BC49A;--ok-bg:#16301F;--ace:#E0B463;--ace-bg:#2E2513;--neg:#E09A9A;--neg-bg:#331F1F;
--val:#6EA8D8;--val-bg:#152433;--pend:#8695A2;--pend-bg:#1C242B}
*{box-sizing:border-box}
/* `hidden` esconde, mesmo em quem tem display próprio (a .corpo é flex) */
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--ink);
font:14.5px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
.topo{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:9px 16px;
border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--bg);z-index:5}
.topo b{font-size:15px}
.q,.topo .n{color:var(--mut);font-size:12px;font-family:ui-monospace,Menlo,monospace}
select,.topo button{font:inherit;font-size:12.5px;padding:3px 9px;border-radius:6px;
border:1px solid var(--rule);background:var(--bg);color:var(--ink);cursor:pointer}
.topo .dir{margin-left:auto;display:flex;gap:8px;align-items:center}
/* Um select tem a largura da opção mais longa; um rótulo de commit comprido empurraria a barra
   para duas linhas. O texto inteiro fica na lista e no título. */
.topo .dir select{max-width:200px;text-overflow:ellipsis}
.recado{padding:7px 16px;font-size:13px;background:var(--ok-bg);color:var(--ok);
border-bottom:1px solid var(--rule)}
.recado.ruim{background:var(--neg-bg);color:var(--neg)}
.recado button{font:inherit;font-size:12.5px;margin-left:10px;padding:1px 9px;border-radius:6px;cursor:pointer;
border:1px solid currentColor;background:transparent;color:inherit}
.corpo{display:flex;align-items:flex-start;--lado:248px}
/* A régua da esquerda: a árvore dos arquivos revisados. A largura é --lado, que o divisor muda. */
.lado{width:var(--lado);flex:0 0 var(--lado);padding:6px 0 16px;position:sticky;top:var(--h-topo);
max-height:calc(100vh - var(--h-topo));overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;
scrollbar-color:var(--rule) transparent}
.lado .resumo{padding:2px 10px 8px 12px;color:var(--mut);font-size:11.5px;line-height:1.45;
font-variant-numeric:tabular-nums}
.ramo{font-size:13px;line-height:24px}
.ramo .no{display:flex;align-items:center;height:24px;position:relative;cursor:pointer;
padding:0 10px 0 calc(6px + (var(--n) - 1) * 12px);white-space:nowrap;outline:0;user-select:none}
.ramo .no:hover{background:color-mix(in srgb,var(--card) 65%,transparent)}
.ramo .no[aria-selected=true]{background:var(--card);box-shadow:inset 2px 0 0 var(--acc)}
.ramo .no:focus-visible{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 70%,transparent)}
.ramo .no[aria-selected=true]:focus-visible{box-shadow:inset 2px 0 0 var(--acc),inset 0 0 0 1px color-mix(in srgb,var(--acc) 70%,transparent)}
.ramo .guias{position:absolute;left:6px;top:0;bottom:0;width:calc((var(--n) - 1) * 12px);pointer-events:none;
background:repeating-linear-gradient(90deg,transparent 0 7px,var(--guia) 7px 8px,transparent 8px 12px)}
.ramo{--guia:color-mix(in srgb,var(--rule) 80%,transparent)}
.ramo .seta{flex:0 0 16px;height:24px;display:flex;align-items:center;justify-content:center;color:var(--mut)}
.ramo .seta svg{width:9px;height:9px;transition:transform .12s ease}
.ramo .no[aria-expanded=true] .seta svg{transform:rotate(90deg)}
.ramo .nome{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;padding-left:2px}
.ramo .pasta .nome{color:#C5D0DA}
.ramo .no[aria-selected=true] .nome{color:#F2F6FA}
.ramo .venc{flex:none;font-size:10px;margin-left:6px;opacity:.9}
.ramo .est{flex:none;min-width:30px;margin-left:8px;text-align:right;font-size:11.5px;
font-variant-numeric:tabular-nums;letter-spacing:.01em}
.ramo .est.ace{color:var(--ace)}
.ramo .est.ok{color:color-mix(in srgb,var(--ok) 55%,var(--mut))}
.ramo .est.novo{color:color-mix(in srgb,var(--mut) 62%,var(--bg));font-size:11px}
.ramo .est .ponto{display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;margin-right:3px;vertical-align:1.5px}
.ramo .nome .sep{color:var(--mut);padding:0 1px}
/* O divisor entre a régua e o documento: um fio de 1px, com 7px de área para pegar. */
.divisor{flex:0 0 1px;position:sticky;top:var(--h-topo);height:calc(100vh - var(--h-topo));background:var(--rule);
cursor:col-resize;z-index:3;outline:0;touch-action:none}
/* Nada a revisar: sem régua, a mensagem toma a largura. */
.corpo.sem-docs .lado,.corpo.sem-docs .divisor{display:none}
.divisor::before{content:'';position:absolute;top:0;bottom:0;left:-3px;right:-3px}
.divisor:hover,.divisor:focus-visible,body.arrastando .divisor{background:var(--acc);box-shadow:0 0 0 1px var(--acc)}
body.arrastando{cursor:col-resize;user-select:none}
body.arrastando *{cursor:col-resize !important;user-select:none !important}
.rot{font-family:system-ui,sans-serif;font-size:10px;text-transform:uppercase;
letter-spacing:.08em;color:var(--mut)}

/* A grade: uma linha por trecho, tres colunas alinhadas. O texto corre de cima a baixo;
   o que separa um trecho do outro e uma regua fina, nao um cartao. */
.doc{flex:1;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 196px;
align-items:stretch}
.cabgrade{position:sticky;top:var(--h-topo);background:var(--bg);border-bottom:1px solid var(--rule);
padding:6px 14px;z-index:4}
.cabgrade .abrir-code{font:inherit;margin-left:8px;padding:1px 7px;border-radius:5px;cursor:pointer;
background:transparent;border:1px solid var(--rule);color:var(--mut)}
.cabgrade .abrir-code:hover{color:var(--acc);border-color:var(--acc)}
/* Aprovar o arquivo inteiro: no lugar do rótulo "o que fazer", numa linha só como ele —
   na coluna estreita (150px) quebra, em vez de empurrar a página para o lado. */
.cabgrade .aprovar-inteiro{font:11.5px/1.4 system-ui,sans-serif;padding:1px 8px;border-radius:5px;cursor:pointer;
background:var(--ok-bg);border:1px solid var(--ok-bg);color:var(--ok);max-width:100%;text-align:left}
.cabgrade .aprovar-inteiro:hover{border-color:var(--ok)}
.cabgrade .aprovar-inteiro[disabled]{opacity:.5;cursor:not-allowed}
.col{padding:10px 14px 14px;border-bottom:1px solid var(--rule);min-width:0}
.col.agora{border-right:1px solid var(--rule)}
.col.agora.inteiro{grid-column:1 / 3}
.col.acoes{display:flex;flex-direction:column;gap:4px;align-items:stretch;padding:10px 10px 12px}
.chip{font:10.5px/1.7 ui-monospace,Menlo,monospace;padding:0 8px;border-radius:999px;
white-space:nowrap;align-self:flex-start}
.e-aprovado{color:var(--ok);background:var(--ok-bg)}.e-mexido{color:var(--ace);background:var(--ace-bg)}
.e-pendente{color:var(--pend);background:var(--pend-bg)}.e-negado{color:var(--neg);background:var(--neg-bg)}
.acoes button{font:inherit;font-size:12.5px;padding:4px 10px;border-radius:6px;cursor:pointer;
border:1px solid var(--rule);background:var(--bg);color:var(--ink);text-align:left}
.acoes button:hover{border-color:var(--acc)}
.acoes button.pri{background:var(--ok-bg);border-color:var(--ok-bg);color:var(--ok)}
.acoes .marcas{display:flex;gap:4px}
.acoes .marcas button{flex:1;text-align:center;padding:3px 0;font-size:12px}
.nota{font-size:12px;border-left:3px solid var(--neg);background:var(--neg-bg);
padding:6px 9px;margin-bottom:8px;border-radius:0 4px 4px 0}
.nota.aviso{border-color:var(--ace);background:var(--ace-bg)}
.form{display:flex;flex-direction:column;gap:5px}
.form input{font:inherit;font-size:12.5px;padding:4px 8px;border-radius:6px;
border:1px solid var(--rule);background:var(--bg);color:var(--ink)}
.vazio{padding:24px;color:var(--mut)}
@media(max-width:1200px){.doc{grid-template-columns:minmax(0,1fr) 150px}
.col.agora.inteiro{grid-column:auto}.corpo{--lado:200px}
/* Duas colunas: a primeira leva as duas metades da comparação, então "a chancela" e "agora"
   dividem a mesma célula, cada um sobre a sua metade; "o que fazer" fica sobre as ações. */
.doc:not(.so-hoje)>.cabgrade:nth-child(-n+2){grid-area:1 / 1}
.doc:not(.so-hoje)>.cabgrade:first-child{width:50%}
.doc:not(.so-hoje)>.cabgrade:nth-child(2){margin-left:50%}}

/* uma mudança: cabeçalho de largura inteira, depois um bloco por linha */
.cab-m{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;
padding:10px 14px 8px;border-top:1px solid var(--ace);background:color-mix(in srgb,var(--ace-bg) 45%,transparent)}
.cab-m.foco{box-shadow:inset 3px 0 0 var(--acc)}
.cab-m .titulo-m{font-weight:600;color:#EDF2F7}
.cab-m .botoes-m{margin-left:auto;display:flex;gap:6px;align-items:center}
.cab-m .botoes-m button{font:inherit;font-size:12.5px;padding:3px 10px;border-radius:6px;cursor:pointer;
border:1px solid var(--rule);background:var(--bg);color:var(--ink)}
.cab-m .botoes-m button.pri{background:var(--ok-bg);border-color:var(--ok-bg);color:var(--ok)}
.cab-m .botoes-m button[disabled]{opacity:.35;cursor:not-allowed}
.cab-m .nota{flex-basis:100%;margin:2px 0 0}
.cab-m .form{flex-direction:row;flex-wrap:wrap;align-items:center}
.inicio-m{border-top:2px solid color-mix(in srgb,var(--ace) 55%,transparent)}
.foco-m{box-shadow:inset 0 2px 0 var(--acc)}
.acoes .tudo{display:flex;flex-direction:column;gap:4px;padding-bottom:8px;margin-bottom:6px;
border-bottom:1px dashed var(--rule)}
#selecao{position:fixed;z-index:20;display:flex;gap:6px;padding:5px;border-radius:8px;
background:var(--card);border:1px solid var(--acc);box-shadow:0 6px 24px #0008}
#selecao[hidden]{display:none}
#selecao button{font:inherit;font-size:12.5px;padding:4px 11px;border-radius:6px;cursor:pointer;
border:1px solid var(--rule);background:var(--bg);color:var(--ink)}
#selecao button.pri{background:var(--ok-bg);border-color:var(--ok-bg);color:var(--ok)}
.dobra{grid-column:1 / -1;padding:4px 14px;color:var(--mut);font-size:11.5px;cursor:pointer;
font-family:ui-monospace,Menlo,monospace;border-bottom:1px solid var(--rule)}
.dobra:hover{color:var(--ink)}
.aviso-doc{grid-column:1 / -1;padding:12px 14px;color:var(--ok);font-size:13px;border-bottom:1px solid var(--rule)}
.aviso-doc.fora-git{color:var(--ace);background:var(--ace-bg)}
.txt.mini{font:11.5px/1.62 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;
word-break:break-word;overflow-wrap:anywhere;max-height:160px;overflow:auto;margin-top:4px;opacity:.85}
.topo .dir button{padding:3px 8px}
.vistas{display:flex;border:1px solid var(--rule);border-radius:7px;overflow:hidden}
.vistas button{border:0;border-radius:0;padding:4px 12px}
.vistas button[aria-selected=true]{background:var(--ink);color:var(--bg)}
.modo{display:inline-flex;vertical-align:middle}
.topo .modo button{border-radius:0}.topo .modo button+button{border-left:0}
.topo .modo button:first-child{border-radius:6px 0 0 6px}.topo .modo button:last-child{border-radius:0 6px 6px 0}
.topo .modo button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.arquivos{padding:12px 18px 60px;max-width:1100px}
.arvore{font:13px/1.5 ui-monospace,Menlo,monospace}
.arvore .no{display:flex;gap:8px;align-items:center;padding:3px 10px;border-radius:5px;outline:0}
.arvore .no:hover{background:var(--card)}
.arvore .no.foco{box-shadow:inset 0 0 0 1px var(--acc)}
.arvore .seta{width:12px;color:var(--mut);cursor:pointer;user-select:none}
.arvore .caixa{cursor:pointer;font-size:15px;user-select:none}
.arvore .caixa.sim{color:var(--ok)}.arvore .caixa.misto{color:var(--ace)}.arvore .caixa.nao{color:var(--mut)}
.arvore .nome{cursor:pointer}.arvore .nome.pasta{color:#EDF2F7;font-weight:600}
.arvore .novos{font-size:10.5px;padding:0 7px;border-radius:999px;color:var(--ok);background:var(--ok-bg)}
.arvore .novos.herdado{background:transparent;border:1px dashed var(--ok-bg)}
.arvore .info{margin-left:auto;color:var(--mut);font-size:12px;white-space:nowrap}
.arvore .info.e-ok{color:var(--ok)}.arvore .info.e-ace{color:var(--ace)}.arvore .info.e-mut{opacity:.7}
.desfazer{position:relative;display:inline-flex}
.desfazer #btn-desfazer{border-radius:6px 0 0 6px}.desfazer #btn-historico{border-radius:0 6px 6px 0;border-left:0}
#historico{position:absolute;top:30px;right:0;z-index:30;min-width:280px;display:flex;flex-direction:column;
background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:4px;box-shadow:0 8px 24px #0008}
#historico[hidden]{display:none}
#historico button{text-align:left;border:0;padding:6px 10px;background:transparent;color:var(--ink);cursor:pointer}
#historico button:hover{background:var(--bg)}
.vazio-geral.ruim{color:var(--neg)}
.vazio-geral{grid-column:1 / -1;padding:40px 20px;color:var(--mut);display:flex;gap:14px;align-items:center}
.vazio-geral button{font:inherit;padding:5px 12px;border-radius:6px;cursor:pointer;border:1px solid var(--ok-bg);
background:var(--ok-bg);color:var(--ok)}
/* os editores: CodeMirror com o live preview */
.cm-editor{background:transparent;color:var(--ink);font:14.5px/1.62 system-ui,-apple-system,"Segoe UI",sans-serif}
.cm-editor.cm-focused{outline:0}
.cm-content{padding:2px 0;caret-color:var(--acc)}
.cm-line.cm-h{padding-top:.35em}
.cm-link-texto{color:var(--acc)}
.cm-line.cm-cit{border-left:3px solid var(--rule);padding-left:10px;color:#B9C6D2}
.cm-line.cm-cit-fazer{border-color:var(--acc);background:color-mix(in srgb,var(--val-bg) 55%,transparent)}
.cm-line.cm-cit-validar{border-color:var(--ace);background:color-mix(in srgb,var(--ace-bg) 55%,transparent)}
.cm-line.cm-cit-comentario{border-color:var(--mut);background:color-mix(in srgb,var(--pend-bg) 70%,transparent)}
.cm-vencida{color:var(--neg);font-weight:700}
.cm-line.cm-codigo{font-family:ui-monospace,Menlo,monospace;font-size:.92em;background:var(--card)}
.cm-line.cm-cerca{font-size:0;line-height:6px}
.cm-line.cm-hr{border-bottom:1px solid var(--rule);color:transparent}
.cm-bala{color:var(--mut);padding-right:2px}.cm-tarefa{color:var(--acc)}
.cm-tabela{overflow-x:auto;margin:4px 0}
.cm-tabela table{border-collapse:collapse;font-size:13.5px}
.cm-tabela th,.cm-tabela td{border:1px solid var(--rule);padding:4px 8px;vertical-align:top;position:relative}
.cm-tabela th{background:var(--card);font-weight:700}
.cm-tab-ctl{display:none;font:inherit;font-size:11px;padding:0 5px;margin-left:4px;border-radius:4px;
  border:1px solid var(--rule);background:var(--bg);color:var(--mut);cursor:pointer}
.cm-tabela tr:hover .cm-tab-ctl,.cm-tabela th:hover .cm-tab-ctl{display:inline-block}
.cm-tab-ctl.recusado{border-color:var(--neg);color:var(--neg)}
.cm-tab-linha{border:0 !important;background:transparent;white-space:nowrap}
.col.mudanca-cm{grid-column:1 / 3;padding:0}
@media(max-width:1200px){.col.mudanca-cm{grid-column:1 / 2}}
.cm-mergeView .cm-editor{padding:10px 14px}
/* As duas colunas de uma mudança vão da borda de cima à de baixo da linha, como as outras:
   a da chancela escura e separada por um fio; a de hoje, com o fundo da página. */
.col.mudanca-cm{display:flex;flex-direction:column}
.col.mudanca-cm>.cm-lugar{flex:1;display:flex;flex-direction:column}
.cm-lugar>.cm-mergeView{flex:1;display:flex;flex-direction:column}
.cm-mergeViewEditors{flex:1}
.cm-mergeViewEditor:first-child{background:color-mix(in srgb,var(--bg) 55%,#000);border-right:1px solid var(--rule)}
/* O que mudou se marca na palavra; a linha inteira não ganha fundo. */
.col.mudanca-cm .cm-merge-a .cm-changedText{text-decoration:line-through;text-decoration-color:var(--neg);background:none}
/* Mudou o alvo escondido de um link: o texto dele, pontilhado, com ↗ — a URL fica no título. */
.col.mudanca-cm .cm-mergeView .cm-alvo-mudou{background:none;text-decoration:underline dotted 2px;text-underline-offset:3px}
.col.mudanca-cm .cm-merge-a .cm-alvo-mudou{text-decoration-color:var(--neg)}
.col.mudanca-cm .cm-merge-b .cm-alvo-mudou{text-decoration-color:var(--ok)}
.cm-alvo-mudou::after{content:'\2197';font-size:.75em;color:var(--mut);margin-left:1px}
/* Linha inteira nova (km/painel/novas.js): uma barra na margem, sem sublinhar cada palavra.
   A margem existe sempre no texto de hoje, para o texto não pular quando a barra some. */
.col.mudanca-cm .cm-merge-b .cm-content{padding-left:8px}
.col.mudanca-cm .cm-merge-b .cm-line.cm-nova{position:relative}
.col.mudanca-cm .cm-merge-b .cm-line.cm-nova::before{content:'';position:absolute;left:-8px;top:0;bottom:0;width:3px;
  background:var(--ok)}
/* A grade rola na horizontal e cortaria o ::before: a barra é a borda dela, na mesma margem. */
.col.mudanca-cm .cm-merge-b .cm-tabela.cm-nova{border-left:3px solid var(--ok);margin-left:-8px;padding-left:5px}
.col.mudanca-cm .cm-merge-b .cm-nova .cm-changedText{background:none}
.col.mudanca-cm .cm-mergeView .cm-editor .cm-changedLine,.col.mudanca-cm .cm-mergeView .cm-editor .cm-deletedChunk{background:transparent}
/* Só hoje: a coluna da chancela some e o texto de hoje toma a linha, centrado e com uma medida
   de leitura. A trilha da chancela fica com largura 0, para os trechos seguirem no mesmo lugar da grade. */
.doc.so-hoje{grid-template-columns:0 minmax(0,1fr) 196px}
.doc.so-hoje>.cabgrade:first-child{visibility:hidden;padding:0;overflow:hidden}
.doc.so-hoje .cm-mergeViewEditor:first-child,.doc.so-hoje .cm-mergeSpacer{display:none}
.doc.so-hoje .cm-lugar{width:100%;max-width:980px;margin-inline:auto}
/* Centrados, os trechos iguais e os mudados precisam da mesma margem para o texto alinhar:
   a da coluna, e a da barra de linha nova (8px) também nos iguais. */
.doc.so-hoje .col.mudanca-cm{padding-inline:14px}
.doc.so-hoje .col.mudanca-cm .cm-mergeView .cm-editor{padding-inline:0}
.doc.so-hoje .col.agora .cm-content{padding-left:8px}
@media(max-width:1200px){.doc.so-hoje{grid-template-columns:minmax(0,1fr) 150px}
.doc.so-hoje>.cabgrade:first-child{display:none}}
.grudado{position:sticky;top:calc(var(--h-topo) + var(--h-cab) + 8px);display:flex;flex-direction:column;gap:4px}
/* O projeto: o nome no topo troca de projeto; a lista mostra quanto falta em cada um. */
.projeto{position:relative;display:inline-flex}
.topo #repo{font-size:15px;font-weight:600;padding:2px 8px 2px 6px;border-color:transparent;
display:inline-flex;align-items:center;gap:6px;max-width:320px}
.topo #repo:hover,.topo #repo[aria-expanded=true]{border-color:var(--rule);background:var(--card)}
.topo #repo .nome-p{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topo #repo .seta-p{color:var(--mut);font-size:10px;font-weight:400}
#menu-projetos{position:absolute;top:34px;left:0;z-index:30;min-width:300px;max-width:460px;display:flex;
flex-direction:column;background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:4px;
box-shadow:0 8px 24px #0008}
#menu-projetos button{display:flex;gap:14px;align-items:baseline;text-align:left;border:0;border-radius:5px;
padding:6px 10px;background:transparent;color:var(--ink);cursor:pointer;font-size:13px}
#menu-projetos button:hover,#menu-projetos button:focus-visible{background:var(--bg);outline:0}
#menu-projetos button[aria-checked=true]{box-shadow:inset 2px 0 0 var(--acc)}
#menu-projetos button[aria-checked=true] .nome-p{color:#F2F6FA;font-weight:600}
#menu-projetos .nome-p{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#menu-projetos .sep{height:1px;background:var(--rule);margin:4px 2px}
#menu-projetos .gerir{color:var(--mut)}
.sit{font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--mut)}

</style></head><body>

    onclick="alternarMenuProjetos()" title="trocar de projeto"><span class="nome-p">km</span><span class="seta-p">▾</span></button>

</div>

    title="o lado direito: esta pasta, outro worktree ou um branch — a chancela é uma só para todos"></select>
  <span class="modo">

  aria-label="largura da lista de arquivos" aria-valuemin="160"

<script type="module">import * as arvore from '/static/painel/arvore.js'; import * as pjs from '/static/painel/projetos.js';
import * as sjs from '/static/painel/sujos.js'; import * as inteiro from '/static/painel/inteiro.js';
window.arvore = arvore; window.pjs = pjs; window.sjs = sjs; window.inteiro = inteiro; window.dispatchEvent(new Event('modulos-prontos'));</script>
<script type="module" src="/static/painel/editores.js"></script>
<script>
const $ = (id) => document.getElementById(id);
// Os editores chegam como módulo, depois deste script; tudo que desenha espera por eles.
const kmPronto = new Promise((ok) => window.km ? ok() : window.addEventListener('km-pronto', ok, { once: true }));
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const neg = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');

// O projeto selecionado (o nome que o servidor dá) e a lista; tudo abaixo age sobre ele.
let P = null, Pcaminho = null, PROJETOS = [], INICIAL = null;
const modulosProntos = new Promise((ok) => window.pjs ? ok() : window.addEventListener('modulos-prontos', ok, { once: true }));
let D = null, doc = 0, ver = 'tudo', base = null, foco = null;
// De onde o lado direito lê: '' é esta pasta; 'wt:…' outro worktree; 'br:…' um branch sem
// worktree, que só se aprova. O servidor só aceita um id da lista que ele mesmo deu.
let lendo = '';
const soAprovar = () => !!(D && D.so_aprovar);
let form = null, recado = '', conflito = null;
// O texto que você escreveu e ainda não salvou, por pedaço da tela. Enquanto houver algo
// aqui a tela não se recarrega sozinha: recarregar apagaria o que você digitou. `bases` é o
// texto do arquivo em que cada edição começou: quando os trechos mudam por baixo (aprovar
// junta blocos iguais), a edição segue o texto, não a posição — sujos.js.
let sujos = {}, originais = {}, bases = {};
const temSujo = () => Object.keys(sujos).length > 0;
const naChancela = () => !D || D.base === 'refs/km/chancela';
// O texto do arquivo termina em quebra de linha e o da tela não; comparar sem isso evita
// marcar como editado um pedaço em que você só clicou.
const mesmo = (a, b) => (a||'').replace(/\s+$/, '') === (b||'').replace(/\s+$/, '');

let carregando = false;
async function carregar(arquivo, forcar){
  if (carregando && !arquivo && !forcar) return;   // um pedido de cada vez: não empilhar recargas
  carregando = true;
  try { return await _carregar(arquivo); } finally { carregando = false; }
}
// Um POST que responde JSON, com o erro do servidor como frase.
async function postar(url, corpo){
  const r = await fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(corpo)});
  const t = await r.text();
  try { return JSON.parse(t); } catch (e) { return {ok: false, erro: `${r.status} ${t}`}; }
}
async function _carregar(arquivo){
  if (!P) return;
  // Só o documento aberto vem com o texto; o resto é a régua lateral.
  const p = P, q = new URLSearchParams({projeto: P});
  if (base) q.set('base', base);
  if (lendo) q.set('lendo', lendo);
  const alvo = arquivo || (D && D.docs[doc] ? D.docs[doc].file : '');
  if (alvo) q.set('file', alvo);
  const r = await fetch('/api/state?' + q);
  // Trocou de projeto enquanto a resposta vinha: ela é do outro.
  if (p !== P) return;
  const nova = await r.json();
  if (!r.ok) { recado = '✕ ' + (nova.erro || 'não deu'); desenharRecado(); return; }
  base = nova.base;
  lendo = nova.lendo || '';
  if (nova.aviso) recado = '✕ ' + nova.aviso;
  const i = nova.docs.findIndex(d => d.file === alvo);
  const antigo = JSON.stringify(D), velho = D, docVelho = doc;
  D = nova; doc = i >= 0 ? i : 0;
  if (D.docs[doc] && !D.docs[doc].cheio) return _carregar(D.docs[doc].file);
  await kmPronto;
  // A recarga de 8 em 8 segundos não reconstrói os editores se nada mudou: reconstruir tira
  // o cursor do lugar e pisca a tela de quem só está lendo.
  if (!arquivo && JSON.stringify(D) === antigo) return;
  // Quem digitou ou está com o cursor num editor enquanto a recarga voltava não perde o texto
  // nem o foco. A página fica inteira no estado que os editores mostram — os shas e as posições
  // precisam casar com eles — e a próxima recarga, depois de salvar ou sair do texto, redesenha.
  if (!arquivo && (temSujo() || km.focado())) { D = velho; doc = docVelho; return; }
  desenhar();
}

async function agir(corpo){
  const arquivo = D.docs[doc].file;
  const j = await postar('/api/act', {...corpo, projeto: P, file: arquivo, lendo,
                                     base: naChancela() ? '' : base});
  // A lista vem com os acompanhados primeiro: a primeira aprovação de um arquivo o muda de
  // lugar. O arquivo aberto se reencontra pelo nome, não pela posição.
  if (j.estado) { D = j.estado; const i = D.docs.findIndex(d => d.file === arquivo); if (i >= 0) doc = i; }
  recado = j.ok ? '✓ ' + (j.msg || 'feito') : '✕ ' + (j.erro || 'não deu');
  if (j.ok && j.desfazer) { aprovadas.push({file: arquivo, commit: j.desfazer, recado, lendo}); aprovadas = aprovadas.slice(-10); }
  if (j.conflito) conflito = {chave: corpo.chave, atual: j.conflito.atual};
  else { conflito = null; form = null; if (j.ok && corpo.chave) { delete sujos[corpo.chave]; delete bases[corpo.chave]; } }
  desenhar();
  if (j.ok && !temSujo()) setTimeout(() => carregar(), 50);
}

// As últimas aprovações desta sessão, para desfazer de trás para frente. Desfazer é um
// commit novo na chancela com o texto que o arquivo tinha antes — o servidor recusa se o
// arquivo foi aprovado de novo depois, e o arquivo no disco não é mexido.
let aprovadas = [];
async function desfazerAprovacao(){
  const a = aprovadas[aprovadas.length - 1];
  if (!a) return;
  if (temSujo() && a.file !== D.docs[doc].file && !confirm('Há texto editado e não salvo. Sair mesmo assim?')) return;
  const j = await postar('/api/act', {acao: 'desfazer', projeto: P, file: a.file, commit: a.commit,
                                      lendo: a.lendo, base: naChancela() ? '' : base});
  if (j.ok) aprovadas.pop();
  else aprovadas = aprovadas.filter(x => x.file !== a.file);   // essa e as mais velhas do mesmo arquivo não voltam mais
  recado = j.ok ? '↶ ' + j.msg : '✕ ' + (j.erro || 'não deu');
  if (j.estado && a.file === D.docs[doc].file && a.lendo === lendo) {
    D = j.estado; const i = D.docs.findIndex(d => d.file === a.file); if (i >= 0) doc = i;
    desenhar();
  } else if (j.ok) {
    // Desfeita num arquivo que não está aberto: ele abre, com o trecho pendente de novo.
    sujos = {}; bases = {}; conflito = null; form = null; foco = null; scrollTo(0, 0);
    lendo = a.lendo;
    await carregar(a.file);
    desenharRecado();
  } else desenharRecado();
}

const segs = () => (D && D.docs[doc] && D.docs[doc].segmentos) || [];
const mudancas = () => segs().filter(s => s.tipo === 'mudanca');
const achar = (n) => mudancas().find(m => m.n === n);

// ---- a régua da esquerda ----------------------------------------------------------
// A árvore dos arquivos revisados (km/painel/arvore.js monta; aqui só se desenha). As pastas
// que você abriu ou fechou ficam como você deixou, também depois de recarregar.
let ARVL = null, abertasL = new Set(), linhasL = [], focoL = null, atualL = null;
let escolhas = {}, escolhasDe = null;
const chaveEscolhas = () => 'km-lado-pastas:' + P;
function gravarEscolhas(){ try { localStorage.setItem(chaveEscolhas(), JSON.stringify(escolhas)); } catch (e) {} }
const SETA = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M3.5 1.5 7 5l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function lado(){
  const A = window.arvore;
  if (escolhasDe !== P) {
    escolhasDe = P;
    try { escolhas = JSON.parse(localStorage.getItem(chaveEscolhas()) || '{}') || {}; } catch (e) { escolhas = {}; }
  }
  ARVL = A.montarArvore(D.docs);
  const atual = D.docs[doc] ? D.docs[doc].file : null;
  const acima = atual ? A.ancestrais(ARVL, atual) : [];
  const novo = atual !== atualL;
  if (novo) {
    // Abrir um arquivo abre as pastas acima dele, mesmo as que você tinha fechado.
    atualL = atual; focoL = atual;
    if (acima.some(c => escolhas[c] === false)) { acima.forEach(c => { delete escolhas[c]; }); gravarEscolhas(); }
  }
  abertasL = new Set([...A.abertasPadrao(ARVL), ...acima]);
  for (const [c, v] of Object.entries(escolhas)) v ? abertasL.add(c) : abertasL.delete(c);
  linhasL = A.visiveis(ARVL, abertasL);
  if (!linhasL.some(l => l.no.caminho === focoL)) focoL = linhasL[0] ? linhasL[0].no.caminho : null;
  $('corpo').classList.toggle('sem-docs', !D.docs.length);
  const nav = $('lado'), noTeclado = !!document.activeElement?.closest?.('#lado');
  // O resumo é da lista: fica no alto dela, e não disputa a barra do topo com os botões.
  const em = D.docs.filter(d => d.rastreado && !d.pendente).length;
  const sem = D.docs.filter(d => !d.rastreado).length;
  const resumo = [`${D.docs.length} arquivos`, `${em} em dia`, D.pct ? `${D.pct} do conteúdo a aprovar` : 'nada a aprovar']
    .concat(sem ? [`${sem} sem chancela`] : []).join(' · ');
  nav.innerHTML = `<div class="resumo">${esc(resumo)}</div><div class="ramo" role="tree" aria-label="arquivos revisados">${linhasL.map(linhaLado).join('')}</div>`;
  const f = nav.querySelector(`[data-caminho="${CSS.escape(focoL || '')}"]`);
  if (f && noTeclado) f.focus({preventScroll: true});
  if (novo) aVista(nav.querySelector('[aria-selected="true"]'), true);
}

function linhaLado(l){
  const n = l.no, pasta = n.tipo === 'pasta', A = window.arvore;
  const e = pasta ? A.estadoPasta(n) : A.estadoArquivo(n.doc);
  const diz = pasta
    ? (n.pendentes ? `${n.pendentes} a aprovar` : (n.novos === n.total ? 'sem chancela' : (n.novos ? `${n.novos} sem chancela` : 'em dia')))
    : (!n.doc.rastreado ? 'sem chancela' : (n.doc.pendente ? `${n.doc.pct} a aprovar` : 'em dia'));
  // Numa pasta aberta o ❓ já aparece no arquivo; repeti-lo em cada pasta acima só faz barulho.
  const venc = e.vencida && !(pasta && abertasL.has(n.caminho)) ? '<span class="venc" aria-hidden="true">❓</span>' : '';
  const titulo = `${n.caminho}${pasta ? '/' : ''} — ${diz}${e.vencida ? ' · ❓ vencida' : ''}`;
  return `<div class="no ${pasta ? 'pasta' : 'arq'}" role="treeitem" aria-level="${l.nivel}" aria-setsize="${l.de}"
    aria-posinset="${l.pos}" ${pasta ? `aria-expanded="${abertasL.has(n.caminho)}"` : `aria-selected="${n.i === doc}"`}
    data-caminho="${esc(n.caminho)}" tabindex="${n.caminho === focoL ? 0 : -1}" title="${esc(titulo)}" style="--n:${l.nivel}">
    <span class="guias"></span><span class="seta">${pasta ? SETA : ''}</span><span class="nome">${esc(n.nome).replaceAll('/', '<span class="sep">/</span>')}</span>${venc}<span class="est ${e.classe}">${esc(e.texto).replace('●', '<i class="ponto"></i>')}</span></div>`;
}

// Rola só a régua, e só o necessário: o documento fica onde está.
function aVista(el, centro){
  if (!el) return;
  const nav = $('lado'), t = el.offsetTop, h = el.offsetHeight;
  if (centro && (t < nav.scrollTop || t + h > nav.scrollTop + nav.clientHeight)) nav.scrollTop = t - nav.clientHeight / 2;
  else if (t < nav.scrollTop) nav.scrollTop = t;
  else if (t + h > nav.scrollTop + nav.clientHeight) nav.scrollTop = t + h - nav.clientHeight;
}

function alternarPasta(c){
  escolhas[c] = !abertasL.has(c); gravarEscolhas();
  focoL = c; lado();
}
function linhaDe(c){ return linhasL.find(l => l.no.caminho === c); }
function focarLinha(c){
  focoL = c;
  for (const el of $('lado').querySelectorAll('[role="treeitem"]')) el.tabIndex = el.dataset.caminho === c ? 0 : -1;
  const el = $('lado').querySelector(`[data-caminho="${CSS.escape(c)}"]`);
  if (el) { el.focus({preventScroll: true}); aVista(el); }
}
function ativar(c){
  const l = linhaDe(c); if (!l) return;
  focoL = c;
  if (l.no.tipo === 'pasta') alternarPasta(c); else if (l.no.i !== doc) abrir(l.no.i);
}
$('lado').addEventListener('click', (e) => {
  const el = e.target.closest('[role="treeitem"]');
  if (el) ativar(el.dataset.caminho);
});
// O teclado é o da árvore WAI-ARIA: ↑ ↓ andam, → abre ou desce, ← fecha ou sobe,
// Enter e espaço abrem o arquivo ou alternam a pasta, Home e End vão às pontas.
$('lado').addEventListener('keydown', (e) => {
  const el = e.target.closest?.('[role="treeitem"]');
  if (!el || e.ctrlKey || e.metaKey || e.altKey) return;
  const i = linhasL.findIndex(l => l.no.caminho === el.dataset.caminho), l = linhasL[i];
  if (!l) return;
  const pasta = l.no.tipo === 'pasta', aberta = pasta && abertasL.has(l.no.caminho);
  const feito = () => { e.preventDefault(); e.stopPropagation(); };
  if (e.key === 'ArrowDown') { feito(); if (i < linhasL.length - 1) focarLinha(linhasL[i + 1].no.caminho); }
  else if (e.key === 'ArrowUp') { feito(); if (i > 0) focarLinha(linhasL[i - 1].no.caminho); }
  else if (e.key === 'Home') { feito(); focarLinha(linhasL[0].no.caminho); }
  else if (e.key === 'End') { feito(); focarLinha(linhasL[linhasL.length - 1].no.caminho); }
  else if (e.key === 'ArrowRight') { feito(); if (pasta && !aberta) alternarPasta(l.no.caminho); else if (aberta) focarLinha(linhasL[i + 1].no.caminho); }
  else if (e.key === 'ArrowLeft') { feito(); if (aberta) alternarPasta(l.no.caminho); else if (l.pai !== null) focarLinha(l.pai); }
  else if (e.key === 'Enter' || e.key === ' ') { feito(); ativar(l.no.caminho); }
});

// ---- o divisor: a largura da régua ------------------------------------------------
// Arrastar, ou ← → com o foco nele; duplo clique volta ao padrão. A largura fica neste
// navegador; a padrão é a do CSS (menor em tela estreita), e nenhuma passa de meia tela.
const LADO_MIN = 160;
let larguraL = null;
try { larguraL = Number(localStorage.getItem('km-lado-largura')) || null; } catch (e) {}
const limitar = (w) => Math.round(Math.max(LADO_MIN, Math.min(w, innerWidth * 0.5)));
function aplicarLargura(gravar){
  const c = $('corpo'), d = $('divisor');
  if (larguraL === null) c.style.removeProperty('--lado'); else c.style.setProperty('--lado', limitar(larguraL) + 'px');
  d.setAttribute('aria-valuemax', Math.round(innerWidth * 0.5));
  d.setAttribute('aria-valuenow', Math.round($('lado').getBoundingClientRect().width));
  if (gravar) try {
    if (larguraL === null) localStorage.removeItem('km-lado-largura');
    else localStorage.setItem('km-lado-largura', String(limitar(larguraL)));
  } catch (e) {}
}
function medir(){ if (window.km && km.medirTodos) km.medirTodos(); }
(function(){
  const d = $('divisor');
  let x0 = 0, w0 = 0, quadro = 0;
  d.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    d.setPointerCapture(e.pointerId);
    x0 = e.clientX; w0 = $('lado').getBoundingClientRect().width;
    document.body.classList.add('arrastando');
  });
  d.addEventListener('pointermove', (e) => {
    if (!d.hasPointerCapture(e.pointerId)) return;
    larguraL = limitar(w0 + e.clientX - x0);
    cancelAnimationFrame(quadro);
    quadro = requestAnimationFrame(() => aplicarLargura(false));
  });
  const soltar = (e) => {
    if (!document.body.classList.contains('arrastando')) return;
    if (d.hasPointerCapture(e.pointerId)) d.releasePointerCapture(e.pointerId);
    document.body.classList.remove('arrastando');
    cancelAnimationFrame(quadro);
    aplicarLargura(true); medir();
  };
  d.addEventListener('pointerup', soltar);
  d.addEventListener('pointercancel', soltar);
  d.addEventListener('dblclick', () => { larguraL = null; aplicarLargura(true); medir(); });
  d.addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault(); e.stopPropagation();
    larguraL = limitar($('lado').getBoundingClientRect().width + (e.key === 'ArrowRight' ? 16 : -16));
    aplicarLargura(true); medir();
  });
  addEventListener('resize', () => aplicarLargura(false));
  aplicarLargura(false);
})();

// ---- os editores ------------------------------------------------------------------
// Cada trecho igual é um editor; cada trecho mudado, uma MergeView (chancela à esquerda,
// hoje à direita). Eles guardam o texto do arquivo e nada mais.
function lugar(chave, linha){
  return `<div class="cm-lugar" data-chave="${esc(chave)}" data-linha="${linha}"></div>`;
}
function montarEditores(){
  for (const el of document.querySelectorAll('.cm-lugar')) {
    const chave = el.dataset.chave;
    const s = chave.startsWith('c:') ? mudancas().find((m) => 'c:' + m.chave === chave)
                                     : segs().find((x) => 'g:' + x.linha === chave);
    if (!s) continue;
    const hojeTexto = chave.startsWith('c:') ? s.agora : s.texto;
    originais[chave] = hojeTexto;
    const atual = sujos[chave] !== undefined ? sujos[chave] : hojeTexto;
    const mudou = (t) => mexeuTexto(chave, t);
    // Um trecho que só saiu não tem o que editar do lado de hoje.
    if (chave.startsWith('c:')) km.editorMudanca(el, chave, s.antes, atual, naChancela() && !soAprovar() && s.geral !== 'saiu', mudou, mostrarBarraSelecao);
    else km.editorSimples(el, chave, atual, !soAprovar(), mudou, null);
  }
}

// ---- o que fazer, por bloco e por mudança -----------------------------------------
function salvarCel(chave){
  if (sujos[chave] === undefined) return '';
  let out = `<span class="chip e-mexido">editado aqui</span>
    <button class="pri" onclick="salvar('${chave}')">Salvar no arquivo</button>
    <button onclick="descartar('${chave}')">Descartar</button>
    ${botoesDeMarca(chave)}
    <div class="q">Ctrl+S salva · Esc descarta</div>`;
  if (conflito && conflito.chave === chave) {
    out += `<div class="nota"><b>esse texto mudou no arquivo</b>
      <div class="q">outro agente ou o editor chegaram primeiro. Nada foi sobrescrito.
      No arquivo agora:</div><div class="txt mini">${esc(conflito.atual)}</div></div>
      <button onclick="copiar('${chave}')">Copiar o meu texto</button>`;
  }
  return out;
}

function formulario(chave, shas){
  return `<div class="form">
    <input id="f-texto" placeholder="por que não serve (opcional)"
      onkeydown="if(event.key==='Enter')enviar();if(event.key==='Escape')fechar()">
    <button class="pri" onclick="enviar()">Reverter</button>
    <button onclick="fechar()">cancelar</button>
    <div class="q">o texto volta ao que você chancelou</div></div>`;
}

function acoesDaMudanca(m){
  const chave = 'c:' + m.chave;
  if (sujos[chave] !== undefined) return salvarCel(chave);
  const shas = m.unidades.map(u => u.sha);
  if (form && form.chave === chave) return formulario(chave, shas);
  const rotulo = {novo: 'novo', saiu: 'saiu', editado: 'editado'}[m.geral];
  if (!naChancela()) return `<span class="chip e-pendente">${rotulo}</span>`;
  const js = esc(JSON.stringify(shas));
  // Um branch sem worktree não tem arquivo para escrever: o trecho inteiro se aprova, e só.
  if (soAprovar()) return `<span class="chip ${m.geral==='saiu'?'e-negado':(m.geral==='novo'?'e-aprovado':'e-mexido')}">${rotulo}</span>
    <button class="pri" onclick="aprovar(${js})">${m.geral==='saiu'?'Aprovar a remoção':'Aprovar'}</button>
    <div class="q">branch sem worktree: só aprovar, o trecho inteiro — para editar, reverter ou aprovar parte, abra um worktree dele</div>`;
  // As marcas entram logo depois do trecho, como texto seu: nada é aprovado no clique.
  const marcas = m.agora ? botoesDeMarca(chave) : '';
  return `<span class="chip ${m.geral==='saiu'?'e-negado':(m.geral==='novo'?'e-aprovado':'e-mexido')}">${rotulo}</span>
    <button class="pri" onclick="aprovar(${js})">${m.geral==='saiu'?'Aprovar a remoção':'Aprovar'}</button>
    <button onclick="abrirForm('${chave}','reverter',${js})">${m.geral==='saiu'?'Trazer de volta':'Reverter'}</button>
    ${marcas}
    <div class="q">para aprovar só uma parte, selecione o texto</div>`;
}

function avisosDaMudanca(m){
  let out = '';
  for (const s of (m.sumidas||[])) out += `<div class="nota"><b>marca removida</b> — ${neg(s.replace(/^\s*>\s*/,''))}
    <div class="q">estava na chancela; aprovar aqui aprova a remoção</div></div>`;
  return out;
}

// ---- o documento ----------------------------------------------------------------
let desenhado = null;   // o arquivo na tela: outro documento abre no topo
function desenhar(){
  if (!D) return;
  // Redesenhar o mesmo documento (depois de aprovar, salvar ou uma recarga) não tira você do
  // lugar: destruir os editores encolhe a página e o navegador leva a rolagem para o topo.
  // A posição é lida antes de qualquer coisa ser destruída.
  const y = scrollY;
  desenharTopo();
  desenharRecado();
  $('lendo').innerHTML = (D.fontes || []).map(f =>
    `<option value="${esc(f.id)}" ${f.id===D.lendo?'selected':''}>${esc(f.rotulo)}</option>`).join('');
  $('lendo').hidden = (D.fontes || []).length < 2;
  $('lendo').previousElementSibling.hidden = $('lendo').hidden;
  $('base').innerHTML = D.revisoes.map(v =>
    `<option value="${esc(v.rev)}" ${v.rev===D.base?'selected':''}>${esc(v.label)}</option>`).join('');
  $('base').title = $('base').selectedOptions[0]?.text || '';
  $('v-tudo').setAttribute('aria-pressed', ver==='tudo');
  $('v-mudou').setAttribute('aria-pressed', ver==='mudou');
  lado();

  const d = D.docs[doc];
  realocarSujos();
  originais = {};
  km.destruirTodos();
  $('selecao').hidden = true;
  if (!d) {
    // Nada acompanhado ainda: um repositório novo, ou tudo pausado. A revisão não tem o
    // que mostrar, e o caminho é escolher arquivos. Uma config quebrada diz o que tem.
    if (D.erro) { $('doc').innerHTML = `<div class="vazio-geral ruim">✕ ${esc(D.erro)}</div>`; return; }
    $('doc').innerHTML = `<div class="vazio-geral">Nenhum arquivo é acompanhado ainda.
      <button class="pri" onclick="mostrar('arquivos')">Escolher arquivos</button></div>`;
    return;
  }
  const fonteAtual = (D.fontes || []).find(f => f.id === D.lendo);
  const onde = D.lendo && fonteAtual ? fonteAtual.rotulo.split(' · ')[0] + (soAprovar() ? ' — último commit' : ' — agora') : 'agora';
  let html = `<div class="cabgrade rot">${naChancela() ? 'a chancela' : esc(D.base)}</div>
    <div class="cabgrade rot">${esc(d.file)} — ${esc(onde)}${soAprovar() ? '' : `<button class="abrir-code" onclick="abrirNoCode()"
      title="abre este arquivo no VS Code — na linha da mudança em foco, se houver">abrir no VS Code</button>`}<button
      class="abrir-code" onclick="copiarCaminho(event)"
      title="copia o caminho dentro do repositório · Shift+clique copia o caminho completo">copiar caminho</button></div>
    <div class="cabgrade rot">${naChancela() ? botaoInteiro(d) || 'o que fazer' : 'só leitura — os botões agem na chancela'}</div>`;
  if (d.fora_do_git) html += `<div class="aviso-doc fora-git">⚠ ${esc(d.fora_do_git)}</div>`;
  if (!segs().some(s => s.tipo === 'mudanca'))
    html += `<div class="aviso-doc">${d.rastreado ? '✓ Em dia com a chancela' + (d.em ? ' de ' + esc(d.em) : '') + '. Nada a decidir neste arquivo.' : ''}</div>`;
  for (const s of segs()){
    if (s.tipo === 'igual') {
      const chave = 'g:' + s.linha;
      if (ver === 'mudou' && sujos[chave] === undefined) {
        html += `<div class="dobra" onclick="setVer('tudo')">⋯ ${s.n_linhas} linhas sem mudança</div>`;
        continue;
      }
      html += `<div class="col agora inteiro">${lugar(chave, s.linha)}</div>
        <div class="col acoes" data-acoes="${esc(chave)}"><div class="grudado">${salvarCel(chave)}</div></div>`;
      continue;
    }
    const chave = 'c:' + s.chave;
    const inicio = ` inicio-m${foco === 'm:' + s.n ? ' foco-m' : ''}`;
    html += `<div class="col mudanca-cm ${s.geral}${inicio}" id="m${s.n}">${avisosDaMudanca(s)}${lugar(chave, s.linha)}</div>
      <div class="col acoes${inicio}" data-acoes="${esc(chave)}"><div class="grudado">${acoesDaMudanca(s)}</div></div>`;
  }
  $('doc').innerHTML = html;
  montarEditores();
  medirCabecalho();
  if (desenhado === d.file) scrollTo(0, y);
  desenhado = d.file;
  const campo = $('f-texto');
  if (campo) campo.focus();
}

// ---- gestos -----------------------------------------------------------------------
function abrir(i){
  if (temSujo() && !confirm('Há texto editado e não salvo. Sair mesmo assim?')) return;
  sujos = {}; bases = {}; conflito = null; form = null; foco = null; scrollTo(0,0);
  carregar(D.docs[i].file);
}
// O VS Code abre no arquivo, na linha da mudança em foco (j/k) se houver uma.
async function abrirNoCode(){
  const m = foco && foco.startsWith('m:') ? achar(Number(foco.slice(2))) : null;
  const j = await postar('/api/abrir', {projeto: P, file: D.docs[doc].file, lendo, ...(m ? {line: m.linha} : {})});
  recado = j.ok ? '✓ ' + j.msg : '✕ ' + j.erro;
  // Só o recado muda: redesenhar tiraria o cursor de quem está no meio de um texto.
  desenharRecado();
}
async function paraAreaDeTransferencia(texto){
  try { await navigator.clipboard.writeText(texto); return true; } catch (err) {
    // Sem a API (uma porta encaminhada que o navegador não trata como local): o jeito antigo.
    const t = document.createElement('textarea');
    t.value = texto; t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.append(t); t.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (err2) {}
    t.remove();
    return ok;
  }
}

// O caminho do arquivo aberto, para colar num terminal, num chat, num agente.
async function copiarCaminho(e){
  // Num branch sem worktree não há arquivo no disco: o completo é o `branch:caminho` do git.
  const rel = D.docs[doc].file;
  const texto = !e.shiftKey ? rel : soAprovar() ? D.lendo.slice(3) + ':' + rel : D.pasta.replace(/\/$/, '') + '/' + rel;
  recado = await paraAreaDeTransferencia(texto) ? '✓ copiado: ' + texto : '✕ não consegui copiar — o caminho é ' + texto;
  desenharRecado();
}
function fechar(){ form = null; desenhar(); }
function abrirForm(chave, tipo, shas){ form = {chave, tipo, shas}; desenhar(); }
function aprovar(shas){ agir({acao:'aprovar', shas}); }
// O arquivo inteiro de uma vez (km/painel/inteiro.js): tudo o que a tela mostra, num commit
// só, que um ↶ Desfazer leva de volta. A aprovação é do arquivo no disco, então espera o
// texto não salvo; e uma marca que sumiria é dita antes, não aprovada às cegas.
const semSalvarInteiro = 'há texto editado e não salvo — salve ou descarte antes de aprovar o arquivo inteiro';
const tituloInteiro = () => temSujo() ? semSalvarInteiro
  : 'aprova todas as mudanças deste arquivo de uma vez, como estão na tela — ↶ Desfazer leva tudo de volta';
function botaoInteiro(d){
  if (!window.inteiro || !inteiro.arquivoInteiro(mudancas())) return '';
  return `<button class="aprovar-inteiro" id="b-inteiro" onclick="aprovarArquivo()" ${temSujo() ? 'disabled' : ''}
    title="${tituloInteiro()}">Aprovar o arquivo · ${esc(d.pct)}</button>`;
}
// Digitar não redesenha o cabeçalho: o botão acompanha o texto não salvo daqui.
function atualizarInteiro(){
  const b = $('b-inteiro');
  if (b) { b.disabled = temSujo(); b.title = tituloInteiro(); }
}
function aprovarArquivo(){
  const x = inteiro.arquivoInteiro(mudancas());
  if (!x) return;
  if (temSujo()) { recado = '✕ ' + semSalvarInteiro; return desenharRecado(); }
  const pergunta = inteiro.perguntaDasMarcas(x.sumidas);
  if (pergunta && !confirm(pergunta)) return;
  aprovar(x.shas);
}
function enviar(){
  const texto = ($('f-texto')||{}).value || '';
  return agir({acao:'reverter', shas: form.shas, motivo: texto});
}
function mexeuTexto(chave, texto){
  if (mesmo(texto, originais[chave])) { delete sujos[chave]; delete bases[chave]; }
  else { if (!(chave in bases)) bases[chave] = originais[chave]; sujos[chave] = texto; }
  atualizarInteiro();
  // Só a coluna das ações muda; o texto que você está digitando fica onde está.
  const cel = document.querySelector(`[data-acoes="${CSS.escape(chave)}"]`);
  if (!cel) return;
  const m = chave.startsWith('c:') ? mudancas().find((x) => 'c:' + x.chave === chave) : null;
  cel.innerHTML = `<div class="grudado">${m ? acoesDaMudanca(m) : salvarCel(chave)}</div>`;
}
function salvar(chave){
  if (sujos[chave] === undefined) return;
  const el = document.querySelector(`.cm-lugar[data-chave="${CSS.escape(chave)}"]`);
  agir({acao:'salvar', chave, original: originais[chave], texto: sujos[chave],
        linha: el ? Number(el.dataset.linha) : 1});
}
// Descartar é fácil de errar (um clique, um Esc): o último texto descartado volta com
// ↶ desfazer no recado ou Ctrl+Z fora do texto — enquanto aquele trecho estiver na tela
// como estava. Se o arquivo mudou por baixo, o texto vai para a área de transferência.
let descartado = null, semLugar = null;
function descartar(chave){
  if (sujos[chave] === undefined) return;
  recado = '✓ edição descartada';
  descartado = {chave, texto: sujos[chave], original: originais[chave],
                file: D.docs[doc].file, lendo, recado};
  delete sujos[chave]; delete bases[chave]; if (conflito && conflito.chave === chave) conflito = null; desenhar();
}
// Os trechos mudaram (uma aprovação, uma recarga): cada edição não salva vai para o trecho
// onde o texto em que ela começou está agora. Sem lugar certo, ela volta para você no recado.
// A edição em conflito fica onde está: a nota ao lado dela já mostra o que há no arquivo.
function realocarSujos(){
  if (!temSujo() || !window.sjs) return;
  const trechos = segs().filter(s => s.tipo === 'igual').map(s => ({chave: 'g:' + s.linha, texto: s.texto}))
    .concat(mudancas().filter(m => m.geral !== 'saiu').map(m => ({chave: 'c:' + m.chave, texto: m.agora})));
  const fixo = conflito && sujos[conflito.chave] !== undefined ? conflito.chave : null;
  const guardado = fixo ? {texto: sujos[fixo], base: bases[fixo]} : null;
  const soltos = {...sujos}, suasBases = {...bases};
  if (fixo) { delete soltos[fixo]; delete suasBases[fixo]; }
  const r = sjs.realocar(soltos, suasBases, trechos.filter(t => t.chave !== fixo));
  sujos = r.sujos; bases = r.bases;
  if (guardado) { sujos[fixo] = guardado.texto; if (guardado.base !== undefined) bases[fixo] = guardado.base; }
  if (r.perdidas.length) {
    const texto = r.perdidas.join('\n\n———\n\n');
    recado = '✕ o trecho que você editava mudou no arquivo antes de você salvar — seu texto está abaixo';
    semLugar = {recado, texto};
    paraAreaDeTransferencia(texto).then(ok => { if (ok && recado === semLugar.recado) {
      recado = semLugar.recado = recado + ' e na área de transferência'; desenharRecado(); } });
    desenharRecado();
  }
}
const podeVoltarDescarte = () => !!descartado && recado === descartado.recado;
async function voltarDescarte(){
  const x = descartado;
  if (!x) return;
  descartado = null;
  // O desenho refaz originais só para os trechos na tela: sem ele, o trecho sumiu.
  const igual = D && D.docs[doc] && D.docs[doc].file === x.file && lendo === x.lendo
    && originais[x.chave] !== undefined && mesmo(originais[x.chave], x.original);
  if (igual) { sujos[x.chave] = x.texto; bases[x.chave] = originais[x.chave]; recado = '↶ edição de volta — ainda não salva'; return desenhar(); }
  // O texto nunca some: fica no recado para você selecionar, e na área de transferência se der.
  recado = '✕ o trecho mudou no arquivo desde o descarte — seu texto está abaixo'
    + (await paraAreaDeTransferencia(x.texto) ? ' e na área de transferência' : '');
  semLugar = {recado, texto: x.texto};
  desenharRecado();
}
function copiar(chave){ navigator.clipboard?.writeText(sujos[chave] || ''); recado = '✓ seu texto está na área de transferência'; desenhar(); }

// A marca entra no formato combinado, com o texto de exemplo selecionado, e vira texto seu:
// você escreve por cima e salva como qualquer outra edição.
// O que gruda no topo (a régua, a linha dos rótulos, os botões de cada mudança) fica logo
// abaixo do que já está grudado: a barra quebra em duas linhas em tela estreita, então a altura
// é medida, não fixa.
function medirCabecalho(){
  const raiz = document.documentElement.style, cab = document.querySelector('.cabgrade');
  // Para baixo: a linha de baixo encosta por baixo da de cima em vez de deixar uma fresta
  // de fração de pixel por onde o texto aparece.
  raiz.setProperty('--h-topo', Math.floor(document.querySelector('.topo').getBoundingClientRect().height) + 'px');
  // A mais alta: no só hoje estreito a primeira some, e mediria 0.
  if (cab) raiz.setProperty('--h-cab', Math.floor(Math.max(...[...document.querySelectorAll('.cabgrade')]
    .map((c) => c.getBoundingClientRect().height))) + 'px');
}
new ResizeObserver(medirCabecalho).observe(document.querySelector('.topo'));
// Abaixo de 1200px os rótulos do cabeçalho ficam mais estreitos e quebram em mais linhas.
addEventListener('resize', medirCabecalho);

// No trecho em que você está escrevendo, a marca entra onde está o cursor; num trecho em que
// você não clicou, depois do trecho.
function marcaNaMudanca(chave, tipo){
  if (km.focado() !== chave) km.focarFim(chave);
  km.inserirMarca(chave, tipo);
}
const botoesDeMarca = (chave) => `<div class="marcas">
      <button onmousedown="event.preventDefault()" onclick="marcaNaMudanca('${chave}','to_do')" title="to_do — para o agente">📌</button>
      <button onmousedown="event.preventDefault()" onclick="marcaNaMudanca('${chave}','to_validate')" title="to_validate — com prazo">❓</button>
      <button onmousedown="event.preventDefault()" onclick="marcaNaMudanca('${chave}','comment')" title="comment — para quem ler depois">💬</button></div>`;
// Um trecho igual não tem botões até o cursor entrar nele: as marcas aparecem na célula ao
// lado, no mesmo lugar em que um trecho mudado as tem, e saem quando o cursor sai.
function marcasDoFoco(chave){
  document.querySelector('.marcas.do-foco')?.remove();
  if (!chave || !chave.startsWith('g:') || sujos[chave] !== undefined || soAprovar()) return;
  const cel = document.querySelector(`[data-acoes="${CSS.escape(chave)}"] .grudado`);
  if (cel) cel.insertAdjacentHTML('beforeend', botoesDeMarca(chave).replace('class="marcas"', 'class="marcas do-foco"'));
}
$('doc').addEventListener('focusin', (e) => marcasDoFoco(e.target.closest('.cm-lugar')?.dataset.chave));
$('doc').addEventListener('focusout', (e) => { if (!e.relatedTarget?.closest?.('.cm-lugar')) marcasDoFoco(null); });
// ---- aprovar parte de um bloco ----------------------------------------------------
// Como aceitar metade de um hunk numa revisão de código: selecione, na coluna do texto
// de hoje, o pedaço cuja mudança você aceita. O resto do bloco continua pendente.
function selecaoAtual(){
  const chave = km.focado();
  if (!chave || !chave.startsWith('c:') || !naChancela()) return null;
  if (sujos[chave] !== undefined) return {erro: 'salve ou descarte a edição deste trecho antes de aprovar parte dela'};

    if (u.ini === u.fim) { if (sel.a <= u.ini && u.ini <= sel.b) shas.push(u.sha); continue; }
    if (sel.b <= u.ini || sel.a >= u.fim) continue;
    if (sel.a <= u.ini && sel.b >= u.fim) shas.push(u.sha);

const CAIXA = {sim: '☑', nao: '☐', misto: '◐'};

function linhaArvore(n, nivel){

    ? (n.total === 0 ? '' : (n.acompanhados === 0 ? 'nenhum' : `${n.acompanhados} de ${n.total}`))
      + (n.excecoes ? ` · ${n.excecoes} exceç${n.excecoes > 1 ? 'ões' : 'ão'}` : '')
    : (n.excecao ? 'exceção' : n.estado);
  const novos = pasta && n.novos
    ? `<span class="novos ${n.regra_propria ? '' : 'herdado'}" title="${n.regra_propria
        ? 'arquivos novos nesta pasta entram sozinhos' : 'entram sozinhos, pela regra de uma pasta acima'}">+ novos</span>` : '';
  let html = `<div class="no ${focoClasse(n)}" role="treeitem" aria-level="${nivel + 1}"
      aria-checked="${ARIA[n.marcado]}" ${pasta ? `aria-expanded="${aberta}"` : ''}

      style="padding-left:${12 + nivel * 20}px">

    <span class="caixa ${n.marcado}" data-acao="clicar">${CAIXA[n.marcado]}</span>

function desenharArvore(){

function desenharProjetos(){
  const cab = `<div class="linha-p cab-p rot" role="presentation"><span>projeto</span><span>situação</span>
    <span class="quantos">arquivos</span><span></span></div>`;
  const linhas = PROJETOS.map((p) => {
    const s = pjs.situacao(p);
    return `<div class="linha-p" role="listitem" tabindex="0" data-projeto="${esc(p.nome)}" ${p.nome === P ? 'aria-current="true"' : ''}
        title="abrir ${esc(p.nome)}">
      <span class="quem"><b>${esc(p.nome)}</b><span class="onde" title="${esc(p.caminho)}"><bdi>${esc(p.caminho)}</bdi></span></span>
      <span class="sit ${s.classe}">${esc(s.texto)}</span>
      <span class="quantos">${p.erro ? '' : p.n}</span>
      <button class="tirar" data-tirar="${esc(p.nome)}" title="tirar ${esc(p.nome)} da lista — o repositório fica como está"
        aria-label="tirar ${esc(p.nome)} da lista">×</button></div>`;
  }).join('');
  $('lista-p').innerHTML = PROJETOS.length ? cab + linhas
    : `<div class="vazio-p">Nenhum projeto ainda. Adicione a raiz de um repositório abaixo — ou rode
       <code>km serve</code> dentro dele, que ele entra sozinho.</div>`;
  const e = $('erro-p'); e.hidden = !erroP; e.textContent = erroP ? '✕ ' + erroP : '';
  desenharTopo();
}
// Os nomes vêm de atributos, nunca de código montado com eles.
$('lista-p').addEventListener('click', (e) => {
  const x = e.target.closest('[data-tirar]');
  if (x) { e.stopPropagation(); return removerProjeto(x.dataset.tirar); }
  const l = e.target.closest('[data-projeto]');
  if (l) trocarProjeto(l.dataset.projeto, 'revisar');
});
$('lista-p').addEventListener('keydown', (e) => {
  const l = e.target.closest?.('.linha-p[data-projeto]');
  if (l && e.target === l && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); trocarProjeto(l.dataset.projeto, 'revisar'); }
});
async function adicionarProjeto(e){
  e.preventDefault();
  const campo = $('p-caminho'), caminho = campo.value.trim();
  if (!caminho) { campo.focus(); return; }
  const r = await postar('/api/projetos', {caminho, init: $('p-init').checked});
  erroP = r.ok ? '' : r.erro;
  if (!r.ok) { recado = ''; desenharRecado(); }   // o erro é deste pedido; o recado anterior sai
  await carregarProjetos();
  if (r.ok) {
    campo.value = ''; $('p-init').checked = false;
    if (!P) selecionar(r.nome, 'projetos');        // o primeiro projeto já fica escolhido
    recado = '✓ ' + r.msg; desenharRecado();
  }
  desenharProjetos();
}
async function removerProjeto(nome){
  if (!confirm(`Tirar ${nome} da lista de projetos?\n\nSó a lista muda: o repositório, o .km/config.json e a chancela ficam como estão.`)) return;
  const r = await postar('/api/projetos/remover', {nome});
  erroP = r.ok ? '' : r.erro;
  recado = r.ok ? '✓ ' + r.msg : ''; desenharRecado();
  if (r.ok && nome === P) desmarcarProjeto();
  await carregarProjetos();
  desenharProjetos();
}

async function iniciar(){
  await modulosProntos;
  await carregarProjetos();
  let lembrado = null;
  try { lembrado = localStorage.getItem('km-projeto'); } catch (e) {}
  const {nome, aviso} = pjs.escolherInicial(PROJETOS, {param: new URLSearchParams(location.search).get('projeto'),
                                                       lembrado, inicial: INICIAL});
  if (nome) selecionar(nome, 'revisar');
  else { lembrar(); mostrar('projetos'); }
  if (aviso) { recado = '✕ ' + aviso; desenharRecado(); }
}
iniciar();
</script></body></html>
